services:
  - type: web
    name: bako-ai
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WEATHER_LAT
        sync: false
      - key: WEATHER_LON
        sync: false
      - key: WEATHER_CITY
        sync: false
      # Solo se usa la primera vez, antes de que exista voz persistida en Mongo
      # (AutoConfig, key tts_voice) — el código lee TTS_VOICE_KEY, no TTS_VOICE.
      - key: TTS_VOICE_KEY
        value: alvaro
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Modelo local vía el túnel del PC de casa. Medido el 05/09/2026 con la AMD
      # RX 7600 de 8 GB (ROCm) y un prompt real de 7.695 tokens: qwen3:8b responde
      # en 0,6 s caliente y 14,8 s si hay que cargarlo — antes, en la GTX 1650,
      # eran 85 s. Por eso el defecto pasa a ser local.
      # OLLAMA_NUM_CTX se queda en 8192 a propósito: a 12288 la generación cae de
      # 37,5 a 5,4 tokens/s en esta GPU.
      # Sin esto, el backend en Render busca Ollama en su PROPIO contenedor
      # (localhost:11434, donde no hay nada): isOllamaAvailable() daba siempre
      # false, el badge de la PWA salía gris y permanentemente fijo en Groq, y
      # LLM_PREFER_LOCAL no llegaba a aplicarse nunca. Es el túnel del PC de casa.
      - key: OLLAMA_URL
        value: https://ollama.bohdeveloper.com
      - key: LLM_PREFER_LOCAL
        value: "true"
      - key: OLLAMA_MODEL
        value: qwen3:8b
      - key: OLLAMA_NUM_CTX
        value: 8192
      # Por encima de los 14,8 s de carga en frío y por debajo del safety de 25 s
      # de los endpoints desktop, para que aún dé tiempo a caer a Groq si falla.
      - key: OLLAMA_TIMEOUT_MS
        value: "18000"
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ai-personal-os.onrender.com
