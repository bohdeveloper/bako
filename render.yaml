services:
  - type: web
    name: bako-ai
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WEATHER_LAT
        sync: false
      - key: WEATHER_LON
        sync: false
      - key: WEATHER_CITY
        sync: false
      # Solo se usa la primera vez, antes de que exista voz persistida en Mongo
      # (AutoConfig, key tts_voice) — el código lee TTS_VOICE_KEY, no TTS_VOICE.
      - key: TTS_VOICE_KEY
        value: alvaro
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Modelo local vía el túnel del PC de casa. Limitado por la VRAM de la GPU:
      # con 4 GB solo llama3.2:3b corre mayormente en GPU (y aun así ~40 s con el
      # prompt compact, por encima del safety de 25 s). Por eso LLM_PREFER_LOCAL
      # está en false: Ollama queda disponible por badge, pero el defecto es Groq.
      # Con la GPU de 8 GB montada, poner los tres a la vez:
      #   LLM_PREFER_LOCAL=true · OLLAMA_MODEL=qwen3:8b · OLLAMA_NUM_CTX=16384
      - key: LLM_PREFER_LOCAL
        value: "false"
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      - key: OLLAMA_NUM_CTX
        value: 8192
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ai-personal-os.onrender.com
