<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BAKO">
  <meta name="theme-color" id="metaTheme" content="#0a0a0a">
  <link rel="manifest" href="/bako-client/manifest.json">
  <link rel="apple-touch-icon" href="/bako-client/icon-192.png">
  <title>BAKO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* ── Modo oscuro (por defecto) ──────────────────────────────────────────── */
    :root,
    html.dark {
      --bg:          #0a0a0a;
      --bg2:         #111111;
      --bg3:         #1a1a1a;
      --border:      #2a2a2a;
      --text:        #e8e8e8;
      --dim:         #555;
      --blue:        #4a9eff;
      --green:       #10b981;
      --yellow:      #f59e0b;
      --red:         #ef4444;
      --bubble-bako: #0e1e32;
      --bubble-user: #0d2b1a;
      --bubble-bako-text: #c8dff8;
      --bubble-user-text: #a8e6c8;
      color-scheme: dark;
    }

    /* ── Modo claro ──────────────────────────────────────────────────────────── */
    html.light {
      --bg:          #fdfefe;
      --bg2:         #f0f2f4;
      --bg3:         #e6e9ec;
      --border:      #d0d4d8;
      --text:        #1a1a1a;
      --dim:         #888;
      --blue:        #0078d4;
      --green:       #059669;
      --yellow:      #d97706;
      --red:         #dc2626;
      --bubble-bako: #dbeafe;
      --bubble-user: #d1fae5;
      --bubble-bako-text: #1e3a5f;
      --bubble-user-text: #1a3a28;
      color-scheme: light;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 10px;
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: border-color 0.3s ease;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 5px; color: var(--text); }
    .header p  { font-size: 10px; color: var(--dim); margin-left: 10px; letter-spacing: 2px; }

    .theme-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--blue); color: var(--blue); }
    .theme-toggle svg   { width: 18px; height: 18px; display: block; }

    /* ── Chat history ────────────────────────────────────────────────────────── */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      transition: background 0.3s ease;
    }
    .chat-history::-webkit-scrollbar { width: 3px; }
    .chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Burbujas de mensaje */
    .msg {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 88%;
      animation: fadeIn 0.2s ease;
    }
    .msg.bako { align-self: flex-start; }
    .msg.user { align-self: flex-end;   flex-direction: row-reverse; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.bako .msg-bubble {
      background: var(--bubble-bako);
      border-bottom-left-radius: 4px;
      color: var(--bubble-bako-text);
      transition: background 0.3s ease, color 0.3s ease;
    }
    .msg.user .msg-bubble {
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
      color: var(--bubble-user-text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .msg-reuse {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--dim);
      font-size: 13px;
      padding: 3px 7px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
      margin-bottom: 2px;
      line-height: 1;
    }
    .msg:hover .msg-reuse,
    .msg:focus-within .msg-reuse { opacity: 1; }

    /* Burbuja de estado (grabando, procesando...) */
    .msg-status {
      align-self: center;
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 1px;
    }

    /* ── Wave (entre chat y controles) ─────────────────────────────────────── */
    .wave-row {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 32px;
    }
    .wave {
      display: flex;
      gap: 4px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .wave.active { opacity: 1; }
    .wave span {
      display: block; width: 3px; border-radius: 2px; background: var(--blue);
      animation: wave 0.8s infinite ease-in-out;
    }
    .wave span:nth-child(1) { height: 8px;  animation-delay: 0s; }
    .wave span:nth-child(2) { height: 18px; animation-delay: 0.1s; }
    .wave span:nth-child(3) { height: 26px; animation-delay: 0.2s; }
    .wave span:nth-child(4) { height: 18px; animation-delay: 0.3s; }
    .wave span:nth-child(5) { height: 8px;  animation-delay: 0.4s; }
    @keyframes wave { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

    /* ── Panel de revisión ───────────────────────────────────────────────────── */
    .review-panel {
      display: none;
      flex-shrink: 0;
      background: var(--bg3);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      transition: background 0.3s ease;
    }
    .review-panel.visible { display: block; }

    .review-label {
      font-size: 11px; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; justify-content: space-between; margin-bottom: 6px;
    }
    .review-countdown { color: var(--yellow); font-weight: 600; }

    .review-progress { height: 2px; background: var(--border); border-radius: 1px; margin-bottom: 8px; overflow: hidden; }
    .review-progress-bar { height: 100%; background: var(--yellow); border-radius: 1px; transition: width 1s linear; width: 100%; }

    .review-text {
      width: 100%; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 11px; color: var(--text); font-size: 15px;
      font-family: inherit; resize: none; outline: none; min-height: 38px;
    }
    .review-text:focus { border-color: var(--blue); }

    .review-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .btn-cancel      { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--dim); font-size: 13px; padding: 6px 12px; cursor: pointer; }
    .btn-send-review { background: var(--blue); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; padding: 6px 18px; cursor: pointer; }

    /* ── Panel inferior ─────────────────────────────────────────────────────── */
    .bottom {
      flex-shrink: 0;
      padding: 10px 14px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .text-row { display: flex; width: 100%; gap: 6px; align-items: center; }
    .text-input {
      flex: 1; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 22px;
      padding: 10px 16px; color: var(--text);
      font-size: 15px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .text-input::placeholder { color: var(--dim); }
    .text-input:focus { border-color: var(--blue); }

    .btn-send-text {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--blue); border: none; color: #fff;
      font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-send-text:active { opacity: 0.8; transform: scale(0.93); }
    .btn-send-text:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Mic inline en la fila de texto */
    .mic-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--bg3); border: 2px solid var(--border);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: all 0.2s; user-select: none; -webkit-user-select: none;
      position: relative; flex-shrink: 0;
    }
    .mic-btn.recording { background: #0d2b0d; border-color: var(--green); }
    .mic-btn.recording::before {
      content: ''; position: absolute; width: 56px; height: 56px;
      border-radius: 50%; border: 2px solid #10b98155; animation: pulse 1.2s infinite;
    }
    /* Procesando o reproduciendo → rojo claro, mismo esquema para ambos: "toca para parar" */
    .mic-btn.processing,
    .mic-btn.playing    { border-color: var(--red); background: rgba(239,68,68,0.18); color: var(--red); cursor: pointer; animation: micPulse 1.2s ease-in-out infinite; }
    .mic-btn.cooldown   { border-color: var(--red); opacity: 0.5; cursor: not-allowed; }
    .mic-btn.stopping   { border-color: var(--red); background: rgba(239,68,68,0.18); }
    .mic-icon svg       { width: 18px; height: 18px; pointer-events: none; display: block; }
    @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0.35); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

    .mic-icon  { font-size: 18px; pointer-events: none; }
    .mic-label { display: none; } /* etiqueta oculta — solo se usa internamente */

    .status-bar { font-size: 12px; color: var(--dim); text-align: center; min-height: 15px; }
    .status-bar.warn  { color: var(--yellow); }
    .status-bar.error { color: var(--red); }
    .status-bar.ok    { color: var(--green); }

    /* ── Login ──────────────────────────────────────────────────────────────── */
    .login-screen {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: var(--bg); flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    .login-screen.visible { display: flex; }
    .login-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px;
      width: min(320px, 90vw); display: flex; flex-direction: column; gap: 14px;
    }
    .login-logo { text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 6px; }
    .login-sub  { text-align: center; font-size: 11px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-top: -8px; }
    .login-input {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 14px; color: var(--text); font-size: 15px; font-family: inherit; outline: none;
    }
    .login-input:focus { border-color: var(--blue); }
    .login-btn {
      background: var(--blue); border: none; border-radius: 10px;
      color: #fff; font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer; margin-top: 4px;
    }
    .login-btn:active { opacity: 0.85; }
    .login-error { font-size: 13px; color: var(--red); text-align: center; min-height: 18px; }

    /* ── Admin panel ─────────────────────────────────────────────────────────── */
    .btn-admin {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px;
      cursor: pointer; color: var(--dim); display: none;
      align-items: center; justify-content: center; transition: border-color 0.2s, color 0.2s;
    }
    .btn-admin.visible { display: flex; }
    .btn-admin:hover { border-color: var(--blue); color: var(--blue); }
    .btn-admin svg { width: 18px; height: 18px; display: block; }

    .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20; }
    .admin-overlay.visible { display: block; }
    .admin-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100vw);
      background: var(--bg2); border-left: 1px solid var(--border);
      padding: 20px 18px; z-index: 21; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    .admin-panel.visible { transform: translateX(0); }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .admin-title  { font-size: 16px; font-weight: 600; }
    .admin-close  { background: none; border: none; color: var(--dim); font-size: 22px; cursor: pointer; line-height: 1; }
    .admin-section-title { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; margin-top: 18px; }
    .user-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    }
    .user-info { flex: 1; }
    .user-name  { font-size: 14px; font-weight: 500; }
    .user-meta  { font-size: 12px; color: var(--dim); }
    .user-item.inactive .user-name { color: var(--dim); text-decoration: line-through; }
    .btn-user-action {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; font-size: 11px; cursor: pointer; color: var(--dim); transition: all 0.15s;
    }
    .btn-user-action.toggle:hover { border-color: var(--yellow); color: var(--yellow); }
    .btn-user-action.del:hover    { border-color: var(--red);    color: var(--red); }
    .create-user-form {
      display: flex; flex-direction: column; gap: 10px;
      padding: 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
    }
    .admin-input {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    .admin-input:focus { border-color: var(--blue); }
    .admin-select {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; cursor: pointer;
    }
    .btn-create-user {
      background: var(--blue); border: none; border-radius: 8px;
      color: #fff; font-size: 14px; font-weight: 600; padding: 10px; cursor: pointer;
    }
    .admin-feedback { font-size: 12px; text-align: center; min-height: 16px; }
    .admin-feedback.ok  { color: var(--green); }
    .admin-feedback.err { color: var(--red); }
    .logout-btn {
      display: block; width: 100%; background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; color: var(--red); font-size: 14px;
      cursor: pointer; margin-top: 20px; transition: border-color 0.2s;
    }
    .logout-btn:hover { border-color: var(--red); }

    /* ── Tabs del panel admin ───────────────────────────────────────────────── */
    .admin-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .admin-tab-btn {
      flex: 1; padding: 9px 4px; font-size: 13px; font-weight: 500;
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--dim); cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .admin-tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .admin-tab-content { display: none; }
    .admin-tab-content.active { display: block; }

    /* ── Memorias ───────────────────────────────────────────────────────────── */
    .mem-toolbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .mem-search {
      flex: 1; min-width: 120px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; color: var(--text); font-size: 13px;
      font-family: inherit; outline: none;
    }
    .mem-search:focus { border-color: var(--blue); }
    .mem-filter {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 8px; color: var(--text); font-size: 12px; font-family: inherit;
      outline: none; cursor: pointer;
    }
    .btn-new-mem {
      background: var(--blue); border: none; border-radius: 8px; color: #fff;
      font-size: 13px; font-weight: 600; padding: 7px 12px; cursor: pointer;
    }
    .mem-stats {
      font-size: 11px; color: var(--dim); margin-bottom: 8px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .mem-stat-badge { padding: 2px 7px; border-radius: 10px; font-weight: 600; }
    .mem-list { display: flex; flex-direction: column; gap: 6px; }
    .mem-item {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .mem-item-top { display: flex; align-items: flex-start; gap: 6px; }
    .mem-item-content { flex: 1; font-size: 13px; color: var(--text); line-height: 1.45; word-break: break-word; }
    .mem-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-mem-action {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 3px 7px; font-size: 11px; cursor: pointer; color: var(--dim);
      transition: all 0.15s;
    }
    .btn-mem-action.edit:hover { border-color: var(--blue);  color: var(--blue); }
    .btn-mem-action.del:hover  { border-color: var(--red);   color: var(--red);  }
    .mem-item-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
    .mem-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 8px;
      font-weight: 600; letter-spacing: 0.3px;
    }
    .mem-badge.high   { background: rgba(239,68,68,0.2);   color: #f87171; }
    .mem-badge.medium { background: rgba(245,158,11,0.2);  color: #fbbf24; }
    .mem-badge.low    { background: rgba(107,114,128,0.2); color: #9ca3af; }
    .mem-badge.social  { background: rgba(74,158,255,0.2); color: #4a9eff; }
    .mem-badge.project { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .mem-badge.personal{ background: rgba(16,185,129,0.2); color: #10b981; }
    .mem-badge.tech    { background: rgba(139,92,246,0.2); color: #a78bfa; }
    .mem-badge.tag     { background: var(--bg2); color: var(--dim); font-weight: 400; }
    .mem-edit-form { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .mem-edit-textarea {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; resize: vertical; min-height: 60px;
    }
    .mem-edit-textarea:focus { border-color: var(--blue); }
    .mem-edit-row { display: flex; gap: 6px; }
    .mem-edit-select {
      flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; color: var(--text); font-size: 12px; font-family: inherit;
      outline: none; cursor: pointer;
    }
    .mem-edit-tags {
      flex: 2; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; color: var(--text); font-size: 12px; font-family: inherit; outline: none;
    }
    .mem-edit-tags:focus, .mem-edit-select:focus { border-color: var(--blue); }
    .mem-edit-actions { display: flex; gap: 6px; }
    .btn-mem-save   { flex: 1; background: var(--blue); border: none; border-radius: 7px; color: #fff; font-size: 12px; font-weight: 600; padding: 6px; cursor: pointer; }
    .btn-mem-cancel { background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--dim); font-size: 12px; padding: 6px 10px; cursor: pointer; }
    .mem-create-form {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 10px; display: none; flex-direction: column; gap: 6px;
    }
    .mem-create-form.visible { display: flex; }
    .mem-load-more { width: 100%; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px; color: var(--dim); font-size: 13px; cursor: pointer; margin-top: 6px; }
    .mem-load-more:hover { border-color: var(--blue); color: var(--blue); }

    /* ── Personas ────────────────────────────────────────────────────────────── */
    .person-card {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; margin-bottom: 8px;
    }
    .person-card-top { display: flex; align-items: flex-start; gap: 8px; }
    .person-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .person-info { flex: 1; }
    .person-name  { font-size: 14px; font-weight: 600; color: var(--text); }
    .person-meta  { font-size: 12px; color: var(--dim); margin-top: 2px; }
    .person-desc  { font-size: 12px; color: var(--text); margin-top: 4px; }
    .person-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .person-notes { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
    .person-note-tag {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      background: var(--bg2); color: var(--dim);
    }
    .person-conexion {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      background: rgba(74,158,255,0.12); color: var(--blue);
    }
    .rel-badge {
      display: inline-block; font-size: 10px; padding: 2px 7px;
      border-radius: 8px; font-weight: 600; margin-left: 6px;
    }
    .rel-pareja    { background: rgba(239,68,68,0.15);   color: #f87171; }
    .rel-familiar  { background: rgba(245,158,11,0.15);  color: #fbbf24; }
    .rel-amigo     { background: rgba(16,185,129,0.15);  color: #10b981; }
    .rel-compañero { background: rgba(139,92,246,0.15);  color: #a78bfa; }
    .rel-conocido  { background: rgba(107,114,128,0.15); color: #9ca3af; }
    .rel-otro      { background: rgba(107,114,128,0.15); color: #9ca3af; }

    .person-form {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; margin-bottom: 10px;
      display: none; flex-direction: column; gap: 8px;
    }
    .person-form.visible { display: flex; }
    .person-form-row { display: flex; gap: 6px; }
    .person-form-row .admin-input { flex: 1; }
    .person-form-title { font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 2px; }
    .person-edit-form { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 8px; }

    /* ── Contraseña visible ─────────────────────────────────────────────────── */
    .pass-wrap { position: relative; display: flex; align-items: center; }
    .pass-wrap input { flex: 1; padding-right: 40px; }
    .eye-btn {
      position: absolute; right: 8px;
      background: none; border: none; cursor: pointer;
      color: var(--dim); padding: 4px; transition: color 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .eye-btn:hover { color: var(--text); }
    .eye-btn svg { width: 18px; height: 18px; display: block; pointer-events: none; }

    /* ── Botón presets ──────────────────────────────────────────────────────── */
    .btn-presets {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-size: 17px; cursor: pointer;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-presets:active, .btn-presets.open { border-color: var(--blue); background: var(--bg2); }

    /* ── Panel de presets (bottom sheet) ────────────────────────────────────── */
    .preset-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 10;
    }
    .preset-overlay.visible { display: block; }

    .preset-panel {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--bg2); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 6px 14px 180px;
      max-height: 68vh; overflow-y: auto;
      z-index: 11;
      transform: translateY(100%);
      transition: transform 0.26s cubic-bezier(.4,0,.2,1);
    }
    .preset-panel.visible { transform: translateY(0); }

    .preset-handle {
      width: 36px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 8px auto 12px;
    }
    .preset-title {
      font-size: 12px; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1.5px;
      text-align: center; margin-bottom: 14px;
    }
    .preset-category { margin-bottom: 14px; }
    .preset-cat-label {
      font-size: 11px; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 7px;
    }
    .preset-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .preset-chip {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 13px;
      font-size: 13px; color: var(--text); cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none; -webkit-user-select: none;
    }
    .preset-chip:active { background: var(--blue); border-color: var(--blue); color: #fff; }
  </style>
</head>

<script>
  // ── Tema (mismo patrón que bohdeveloper.com) ──────────────────────────────
  const iconMoon    = document.getElementById('iconMoon');
  const iconSun     = document.getElementById('iconSun');
  const metaTheme   = document.getElementById('metaTheme');

  function applyTheme(theme) {
    const html = document.documentElement;
    if (theme === 'light') {
      html.classList.add('light');
      html.classList.remove('dark');
      iconMoon.style.display = 'none';
      iconSun.style.display  = 'block';
      metaTheme.content = '#fdfefe';
    } else {
      html.classList.add('dark');
      html.classList.remove('light');
      iconMoon.style.display = 'block';
      iconSun.style.display  = 'none';
      metaTheme.content = '#0a0a0a';
    }
  }

  // Cargar preferencia guardada (default: dark)
  applyTheme(localStorage.getItem('bako-theme') || 'dark');

  document.getElementById('themeToggle').addEventListener('click', () => {
    const current  = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    const newTheme = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem('bako-theme', newTheme);
    applyTheme(newTheme);
  });

  // ─────────────────────────────────────────────────────────────────────────
  const BAKO_URL    = window.location.origin;
  const REVIEW_SECS = 5;
  const MIN_GAP_MS  = 3000;

  // ── Auth ──────────────────────────────────────────────────────────────────
  const loginScreen  = document.getElementById('loginScreen');
  const loginUserEl  = document.getElementById('loginUser');
  const loginPassEl  = document.getElementById('loginPass');
  const loginBtn     = document.getElementById('loginBtn');
  const loginError   = document.getElementById('loginError');
  const btnAdmin     = document.getElementById('btnAdmin');
  const adminPanel   = document.getElementById('adminPanel');
  const adminOverlay = document.getElementById('adminOverlay');
  const adminClose   = document.getElementById('adminClose');
  const userList     = document.getElementById('userList');
  const newUserName  = document.getElementById('newUserName');
  const newUserPass  = document.getElementById('newUserPass');
  const newUserRole  = document.getElementById('newUserRole');
  const btnCreateUser= document.getElementById('btnCreateUser');
  const adminFeedback= document.getElementById('adminFeedback');
  const logoutBtn    = document.getElementById('logoutBtn');

  function getToken()    { return localStorage.getItem('bako-token') || ''; }
  function getAuthUser() { try { return JSON.parse(localStorage.getItem('bako-user') || 'null'); } catch { return null; } }

  function authHeaders(extra = {}) {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}`, ...extra };
  }

  function showLoginScreen() {
    loginScreen.classList.add('visible');
    loginError.textContent = '';
    loginUserEl.value = '';
    loginPassEl.value = '';
    setTimeout(() => loginUserEl.focus(), 100);
  }

  function showApp(user) {
    loginScreen.classList.remove('visible');
    if (user?.role === 'superadmin') btnAdmin.classList.add('visible');
    else btnAdmin.classList.remove('visible');
  }

  async function doLogin() {
    const username = loginUserEl.value.trim();
    const password = loginPassEl.value;
    if (!username || !password) { loginError.textContent = 'Rellena usuario y contraseña'; return; }
    loginBtn.disabled = true; loginBtn.textContent = 'Accediendo…';
    try {
      const res = await fetch(`${BAKO_URL}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { loginError.textContent = data.error || 'Error al acceder'; return; }
      localStorage.setItem('bako-token', data.token);
      localStorage.setItem('bako-user', JSON.stringify(data.user));
      showApp(data.user);
    } catch {
      loginError.textContent = 'Sin conexión con BAKO';
    } finally {
      loginBtn.disabled = false; loginBtn.textContent = 'Acceder';
    }
  }

  function doLogout() {
    localStorage.removeItem('bako-token');
    localStorage.removeItem('bako-user');
    closeAdmin();
    showLoginScreen();
  }

  // SVG icono stop (cuadrado rojo — visible en el botón mic al interrumpir)
  const SVG_STOP = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>`;
  const SVG_MIC  = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/></svg>`;

  // SVG ojo abierto (contraseña oculta → pulsar para ver)
  const SVG_EYE_OPEN = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`;
  // SVG ojo tachado (contraseña visible → pulsar para ocultar)
  const SVG_EYE_OFF  = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>`;

  function togglePassVisibility(inp, btn) {
    const show = inp.type === 'password';
    inp.type       = show ? 'text' : 'password';
    btn.innerHTML  = show ? SVG_EYE_OFF : SVG_EYE_OPEN;
  }
  // Delegar en todos los .eye-btn con data-target (login + crear usuario)
  document.addEventListener('click', e => {
    const btn = e.target.closest('.eye-btn[data-target]');
    if (!btn) return;
    const inp = document.getElementById(btn.dataset.target);
    if (inp) togglePassVisibility(inp, btn);
  });

  loginBtn.addEventListener('click', doLogin);
  loginPassEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  loginUserEl.addEventListener('keydown', e => { if (e.key === 'Enter') loginPassEl.focus(); });
  logoutBtn.addEventListener('click', doLogout);

  // ── Admin panel ───────────────────────────────────────────────────────────
  function openAdmin() {
    adminPanel.classList.add('visible');
    adminOverlay.classList.add('visible');
    loadUsers();
  }
  function closeAdmin() {
    adminPanel.classList.remove('visible');
    adminOverlay.classList.remove('visible');
  }

  btnAdmin.addEventListener('click', openAdmin);
  adminClose.addEventListener('click', closeAdmin);
  adminOverlay.addEventListener('click', closeAdmin);

  async function loadUsers() {
    userList.innerHTML = '<div style="color:var(--dim);font-size:13px">Cargando…</div>';
    try {
      const res  = await fetch(`${BAKO_URL}/api/auth/users`, { headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) { userList.innerHTML = `<div style="color:var(--red)">${data.error}</div>`; return; }
      if (!data.users.length) { userList.innerHTML = '<div style="color:var(--dim);font-size:13px">Sin usuarios</div>'; return; }
      userList.innerHTML = '';
      data.users.forEach(u => {
        const item = document.createElement('div');
        item.className = 'user-item' + (u.active ? '' : ' inactive');
        item.innerHTML = `
          <div class="user-info">
            <div class="user-name">${u.username}</div>
            <div class="user-meta">${u.role} · ${u.active ? 'activo' : 'inactivo'}</div>
          </div>
          <button class="btn-user-action edit"   data-id="${u._id}" data-name="${u.username}" title="Editar">✏️</button>
          ${u.role !== 'superadmin' ? `
            <button class="btn-user-action toggle" data-id="${u._id}" title="${u.active ? 'Desactivar' : 'Activar'}">${u.active ? '🔒' : '🔓'}</button>
            <button class="btn-user-action del"    data-id="${u._id}" title="Eliminar">🗑</button>
          ` : ''}
        `;
        userList.appendChild(item);
      });
      userList.querySelectorAll('.edit').forEach(btn => btn.addEventListener('click', e => {
        openEditForm(e.currentTarget.dataset.id, e.currentTarget.dataset.name);
      }));
      userList.querySelectorAll('.toggle').forEach(btn => btn.addEventListener('click', async e => {
        const id  = e.currentTarget.dataset.id;
        const res = await fetch(`${BAKO_URL}/api/auth/users/${id}/toggle`, { method: 'PATCH', headers: authHeaders() });
        if (res.ok) loadUsers();
      }));
      userList.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', async e => {
        if (!confirm('¿Eliminar usuario?')) return;
        const id  = e.currentTarget.dataset.id;
        const res = await fetch(`${BAKO_URL}/api/auth/users/${id}`, { method: 'DELETE', headers: authHeaders() });
        if (res.ok) loadUsers();
      }));
    } catch {
      userList.innerHTML = '<div style="color:var(--red)">Error al cargar usuarios</div>';
    }
  }

  btnCreateUser.addEventListener('click', async () => {
    const username = newUserName.value.trim();
    const password = newUserPass.value;
    const role     = newUserRole.value;
    if (!username || !password) { setAdminFeedback('Rellena usuario y contraseña', false); return; }
    btnCreateUser.disabled = true;
    try {
      const res  = await fetch(`${BAKO_URL}/api/auth/users`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ username, password, role }),
      });
      const data = await res.json();
      if (!res.ok) { setAdminFeedback(data.error, false); return; }
      setAdminFeedback(`✓ ${data.user.username} creado`, true);
      newUserName.value = ''; newUserPass.value = '';
      loadUsers();
    } catch {
      setAdminFeedback('Error de conexión', false);
    } finally {
      btnCreateUser.disabled = false;
    }
  });

  function setAdminFeedback(msg, ok) {
    adminFeedback.textContent = msg;
    adminFeedback.className   = 'admin-feedback ' + (ok ? 'ok' : 'err');
    setTimeout(() => { adminFeedback.textContent = ''; adminFeedback.className = 'admin-feedback'; }, 3000);
  }

  // ── Tabs del panel admin ──────────────────────────────────────────────────
  document.querySelectorAll('.admin-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'tabMemories') loadMemories();
      if (btn.dataset.tab === 'tabPeople')   loadPeople();
    });
  });

  // ── Personas ──────────────────────────────────────────────────────────────
  const REL_LABELS = { pareja:'Pareja', familiar:'Familiar', amigo:'Amigo', compañero:'Compañero', conocido:'Conocido', otro:'Otro' };

  function personAvatar(nombre) {
    return (nombre || '?')[0].toUpperCase();
  }

  async function loadPeople() {
    document.getElementById('peopleList').innerHTML = '<div style="color:var(--dim);font-size:13px">Cargando…</div>';
    try {
      const res  = await fetch(`${BAKO_URL}/api/people`, { headers: authHeaders() });
      const data = await res.json();
      renderPeople(data.people || []);
    } catch {
      document.getElementById('peopleList').innerHTML = '<div style="color:var(--red)">Error al cargar personas</div>';
    }
  }

  function renderPeople(people) {
    const list = document.getElementById('peopleList');
    list.innerHTML = '';
    if (!people.length) {
      list.innerHTML = '<div style="color:var(--dim);font-size:13px;text-align:center;padding:16px">Sin personas registradas — añade la primera</div>';
      return;
    }
    people.forEach(p => list.appendChild(buildPersonCard(p)));
  }

  function buildPersonCard(p) {
    const card = document.createElement('div');
    card.className = 'person-card';
    card.id = 'person-' + p._id;

    const cumple = p.cumpleaños ? `🎂 ${p.cumpleaños}` : '';
    const loc    = p.ubicacion  ? `📍 ${p.ubicacion}`  : '';
    const work   = p.trabajo    ? `💼 ${p.trabajo}`    : '';
    const meta   = [cumple, loc, work].filter(Boolean).join(' · ');

    const notesHtml = (p.notas || []).map(n => `<span class="person-note-tag">${escHtml(n)}</span>`).join('');
    const connHtml  = (p.conexiones || []).map(c => `<span class="person-conexion">🔗 ${escHtml(c)}</span>`).join('');

    card.innerHTML = `
      <div class="person-card-top">
        <div class="person-avatar">${personAvatar(p.nombre)}</div>
        <div class="person-info">
          <div class="person-name">${escHtml(p.nombre)}<span class="rel-badge rel-${p.relacion}">${REL_LABELS[p.relacion] || p.relacion}</span></div>
          ${p.descripcion ? `<div class="person-desc">${escHtml(p.descripcion)}</div>` : ''}
          ${meta ? `<div class="person-meta">${meta}</div>` : ''}
        </div>
        <div class="person-actions">
          <button class="btn-mem-action edit" data-id="${p._id}" title="Editar">✏️</button>
          <button class="btn-mem-action del"  data-id="${p._id}" title="Eliminar">🗑</button>
        </div>
      </div>
      ${(notesHtml || connHtml) ? `<div class="person-notes">${notesHtml}${connHtml}</div>` : ''}
    `;

    card.querySelector('.edit').addEventListener('click', () => togglePersonEdit(p, card));
    card.querySelector('.del').addEventListener('click',  () => deletePerson(p._id, card));
    return card;
  }

  function togglePersonEdit(p, card) {
    const existing = card.querySelector('.person-edit-form');
    if (existing) { existing.remove(); return; }

    const form = document.createElement('div');
    form.className = 'person-edit-form';
    form.innerHTML = `
      <div class="person-form-row">
        <input class="admin-input ep-nombre"    type="text" value="${escHtml(p.nombre)}" placeholder="Nombre">
        <select class="admin-select ep-relacion">
          ${['pareja','familiar','amigo','compañero','conocido','otro'].map(r =>
            `<option value="${r}" ${p.relacion===r?'selected':''}>${REL_LABELS[r]}</option>`).join('')}
        </select>
      </div>
      <input class="admin-input ep-desc"       type="text" value="${escHtml(p.descripcion||'')}" placeholder="Descripción breve">
      <div class="person-form-row">
        <input class="admin-input ep-cumple"    type="text" value="${escHtml(p.cumpleaños||'')}" placeholder="Cumpleaños DD-MM">
        <input class="admin-input ep-ubicacion" type="text" value="${escHtml(p.ubicacion||'')}"  placeholder="Dónde vive">
      </div>
      <div class="person-form-row">
        <input class="admin-input ep-trabajo"   type="text" value="${escHtml(p.trabajo||'')}"   placeholder="Trabajo">
        <input class="admin-input ep-conexiones"type="text" value="${escHtml((p.conexiones||[]).join(', '))}" placeholder="Conexiones">
      </div>
      <input class="admin-input ep-notas" type="text" value="${escHtml((p.notas||[]).join(' · '))}" placeholder="Notas separadas por ·">
      <div class="mem-edit-actions">
        <button class="btn-mem-save ep-save">Guardar</button>
        <button class="btn-mem-cancel ep-cancel">Cancelar</button>
      </div>
      <div class="admin-feedback ep-fb"></div>
    `;
    card.appendChild(form);

    form.querySelector('.ep-cancel').addEventListener('click', () => form.remove());
    form.querySelector('.ep-save').addEventListener('click', async () => {
      const body = {
        nombre:      form.querySelector('.ep-nombre').value.trim(),
        relacion:    form.querySelector('.ep-relacion').value,
        descripcion: form.querySelector('.ep-desc').value.trim(),
        cumpleaños:  form.querySelector('.ep-cumple').value.trim(),
        ubicacion:   form.querySelector('.ep-ubicacion').value.trim(),
        trabajo:     form.querySelector('.ep-trabajo').value.trim(),
        conexiones:  form.querySelector('.ep-conexiones').value.split(',').map(s=>s.trim()).filter(Boolean),
        notas:       form.querySelector('.ep-notas').value.split('·').map(s=>s.trim()).filter(Boolean),
      };
      if (!body.nombre) return;
      form.querySelector('.ep-save').disabled = true;
      const res  = await fetch(`${BAKO_URL}/api/people/${p._id}`, {
        method: 'PUT', headers: authHeaders(), body: JSON.stringify(body),
      });
      const data = await res.json();
      if (res.ok) {
        Object.assign(p, data.person);
        const newCard = buildPersonCard(p);
        card.replaceWith(newCard);
      } else {
        const fb = form.querySelector('.ep-fb');
        fb.textContent = data.error || 'Error'; fb.className = 'admin-feedback err';
        form.querySelector('.ep-save').disabled = false;
      }
    });
  }

  async function deletePerson(id, card) {
    if (!confirm('¿Eliminar esta persona?')) return;
    const res = await fetch(`${BAKO_URL}/api/people/${id}`, { method: 'DELETE', headers: authHeaders() });
    if (res.ok) card.remove();
  }

  // Crear persona
  document.getElementById('btnNewPerson').addEventListener('click', () => {
    const f = document.getElementById('personCreateForm');
    f.classList.toggle('visible');
    if (f.classList.contains('visible')) document.getElementById('pNombre').focus();
  });
  document.getElementById('btnCancelNewPerson').addEventListener('click', () => {
    document.getElementById('personCreateForm').classList.remove('visible');
  });
  document.getElementById('btnSaveNewPerson').addEventListener('click', async () => {
    const nombre = document.getElementById('pNombre').value.trim();
    const fb     = document.getElementById('personCreateFeedback');
    if (!nombre) { fb.textContent = 'El nombre es obligatorio'; fb.className = 'admin-feedback err'; return; }
    document.getElementById('btnSaveNewPerson').disabled = true;
    const body = {
      nombre,
      relacion:    document.getElementById('pRelacion').value,
      descripcion: document.getElementById('pDescripcion').value.trim(),
      cumpleaños:  document.getElementById('pCumple').value.trim(),
      ubicacion:   document.getElementById('pUbicacion').value.trim(),
      trabajo:     document.getElementById('pTrabajo').value.trim(),
      conexiones:  document.getElementById('pConexiones').value.split(',').map(s=>s.trim()).filter(Boolean),
      notas:       document.getElementById('pNotas').value.split('·').map(s=>s.trim()).filter(Boolean),
    };
    try {
      const res  = await fetch(`${BAKO_URL}/api/people`, { method:'POST', headers: authHeaders(), body: JSON.stringify(body) });
      const data = await res.json();
      if (res.ok) {
        fb.textContent = `✓ ${data.person.nombre} añadido`; fb.className = 'admin-feedback ok';
        ['pNombre','pDescripcion','pCumple','pUbicacion','pTrabajo','pConexiones','pNotas'].forEach(id => { document.getElementById(id).value = ''; });
        setTimeout(() => { document.getElementById('personCreateForm').classList.remove('visible'); fb.textContent = ''; }, 1200);
        await loadPeople();
      } else {
        fb.textContent = data.error || 'Error'; fb.className = 'admin-feedback err';
      }
    } catch { fb.textContent = 'Error de conexión'; fb.className = 'admin-feedback err'; }
    finally { document.getElementById('btnSaveNewPerson').disabled = false; }
  });

  // ── Memorias — tiers ──────────────────────────────────────────────────────
  const MEM_SOCIAL_TAGS  = ['familia','amigos','familia-politica','pareja','suegros','cuniada','cuniado','hermana','padre','madre','padres','yaimy','paula','julen','ibon','sofi','nati','elena','oscar','osvaldo'];
  const MEM_PROJECT_TAGS = ['bako','diamadmin','unyona','kefir','ai-personal-os','matrix-game','bohdeveloper','ingresos-pasivos','robotica','busqueda-empleo','proyectos'];
  const MEM_PERSONAL_TAGS= ['salud','gustos','historia','motivacion','valores','objetivos','finanzas','caracter','rutina','entrenamiento','lae','correccion','judicial','psicologo','hobbies','suenos','miedos','transformacion'];

  function memTier(m) {
    const t = m.tags || [];
    if (t.some(x => MEM_SOCIAL_TAGS.includes(x)))   return 'social';
    if (t.some(x => MEM_PROJECT_TAGS.includes(x)))  return 'project';
    if (t.some(x => MEM_PERSONAL_TAGS.includes(x))) return 'personal';
    return 'tech';
  }
  const TIER_LABEL = { social: '🔵 Social', project: '🟠 Proyecto', personal: '🟢 Personal', tech: '🟣 Técnico' };

  // ── Memorias — estado y carga ─────────────────────────────────────────────
  let _allMems = [];
  let _memPage = 20;

  async function loadMemories() {
    document.getElementById('memList').innerHTML = '<div style="color:var(--dim);font-size:13px">Cargando…</div>';
    try {
      const res  = await fetch(`${BAKO_URL}/api/agent/memories`, { headers: authHeaders() });
      const data = await res.json();
      _allMems   = data.memories || [];
      _memPage   = 20;
      renderMemories();
    } catch {
      document.getElementById('memList').innerHTML = '<div style="color:var(--red)">Error al cargar memorias</div>';
    }
  }

  function filteredMems() {
    const q    = (document.getElementById('memSearch')?.value || '').toLowerCase();
    const tier = document.getElementById('memFilterTier')?.value || '';
    const imp  = document.getElementById('memFilterImp')?.value  || '';
    return _allMems.filter(m => {
      if (q    && !m.content.toLowerCase().includes(q) && !(m.tags||[]).some(t => t.toLowerCase().includes(q))) return false;
      if (tier && memTier(m) !== tier)    return false;
      if (imp  && m.importance !== imp)   return false;
      return true;
    });
  }

  function renderMemories() {
    const mems = filteredMems();

    // Stats
    const counts = { social: 0, project: 0, personal: 0, tech: 0 };
    _allMems.forEach(m => counts[memTier(m)]++);
    document.getElementById('memStats').innerHTML =
      `<span>${_allMems.length} memorias</span>` +
      `<span class="mem-stat-badge" style="background:rgba(74,158,255,0.15);color:#4a9eff">🔵 ${counts.social}</span>` +
      `<span class="mem-stat-badge" style="background:rgba(245,158,11,0.15);color:#f59e0b">🟠 ${counts.project}</span>` +
      `<span class="mem-stat-badge" style="background:rgba(16,185,129,0.15);color:#10b981">🟢 ${counts.personal}</span>` +
      `<span class="mem-stat-badge" style="background:rgba(139,92,246,0.15);color:#a78bfa">🟣 ${counts.tech}</span>`;

    const list    = document.getElementById('memList');
    const visible = mems.slice(0, _memPage);
    list.innerHTML = '';

    if (!mems.length) {
      list.innerHTML = '<div style="color:var(--dim);font-size:13px;text-align:center;padding:16px">Sin resultados</div>';
      document.getElementById('memLoadMore').style.display = 'none';
      return;
    }

    visible.forEach(m => list.appendChild(buildMemItem(m)));

    const loadMore = document.getElementById('memLoadMore');
    loadMore.style.display = mems.length > _memPage ? 'block' : 'none';
    loadMore.textContent   = `Cargar más (${mems.length - _memPage} restantes)`;
  }

  function buildMemItem(m) {
    const tier  = memTier(m);
    const item  = document.createElement('div');
    item.className = 'mem-item';
    item.id        = 'memitem-' + m._id;

    const tagsHtml = (m.tags || []).slice(0, 4).map(t =>
      `<span class="mem-badge tag">${t}</span>`).join('');

    item.innerHTML = `
      <div class="mem-item-top">
        <div class="mem-item-content">${escHtml(m.content)}</div>
        <div class="mem-item-actions">
          <button class="btn-mem-action edit" data-id="${m._id}" title="Editar">✏️</button>
          <button class="btn-mem-action del"  data-id="${m._id}" title="Eliminar">🗑</button>
        </div>
      </div>
      <div class="mem-item-meta">
        <span class="mem-badge ${tier}">${TIER_LABEL[tier]}</span>
        <span class="mem-badge ${m.importance}">${m.importance}</span>
        ${tagsHtml}
      </div>
    `;

    item.querySelector('.edit').addEventListener('click', () => toggleMemEdit(m, item));
    item.querySelector('.del').addEventListener('click',  () => deleteMem(m._id, item));
    return item;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toggleMemEdit(m, item) {
    const existing = item.querySelector('.mem-edit-form');
    if (existing) { existing.remove(); return; }

    const form = document.createElement('div');
    form.className = 'mem-edit-form';
    form.innerHTML = `
      <textarea class="mem-edit-textarea">${m.content}</textarea>
      <div class="mem-edit-row">
        <select class="mem-edit-select imp-sel">
          ${['high','medium','low'].map(v => `<option value="${v}" ${m.importance===v?'selected':''}>${v}</option>`).join('')}
        </select>
        <select class="mem-edit-select type-sel">
          ${['fact','preference','project_update','decision','feeling'].map(v => `<option value="${v}" ${m.type===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <input class="mem-edit-tags tags-inp" type="text" placeholder="Tags: familia, yaimy" value="${(m.tags||[]).join(', ')}">
      <div class="mem-edit-actions">
        <button class="btn-mem-save save-btn">Guardar</button>
        <button class="btn-mem-cancel">Cancelar</button>
      </div>
      <div class="admin-feedback ef"></div>
    `;
    item.appendChild(form);

    form.querySelector('.btn-mem-cancel').addEventListener('click', () => form.remove());
    form.querySelector('.save-btn').addEventListener('click', async () => {
      const body = {
        content:    form.querySelector('textarea').value.trim(),
        importance: form.querySelector('.imp-sel').value,
        type:       form.querySelector('.type-sel').value,
        tags:       form.querySelector('.tags-inp').value,
      };
      if (!body.content) return;
      form.querySelector('.save-btn').disabled = true;
      try {
        const res = await fetch(`${BAKO_URL}/api/agent/memories/${m._id}`, {
          method: 'PUT', headers: authHeaders(), body: JSON.stringify(body),
        });
        if (res.ok) {
          const updated = (await res.json()).memory;
          Object.assign(m, updated);
          const newItem = buildMemItem(m);
          item.replaceWith(newItem);
        } else {
          const fb = form.querySelector('.ef');
          fb.textContent = (await res.json()).error || 'Error';
          fb.className   = 'admin-feedback ef err';
          form.querySelector('.save-btn').disabled = false;
        }
      } catch {
        form.querySelector('.save-btn').disabled = false;
      }
    });
    return form;
  }

  async function deleteMem(id, item) {
    if (!confirm('¿Eliminar esta memoria?')) return;
    const res = await fetch(`${BAKO_URL}/api/agent/memories/${id}`, {
      method: 'DELETE', headers: authHeaders(),
    });
    if (res.ok) {
      _allMems = _allMems.filter(m => m._id !== id);
      item.remove();
      renderMemories();
    }
  }

  // Crear memoria
  document.getElementById('btnNewMem').addEventListener('click', () => {
    const f = document.getElementById('memCreateForm');
    f.classList.toggle('visible');
    if (f.classList.contains('visible')) document.getElementById('newMemContent').focus();
  });
  document.getElementById('btnCancelNewMem').addEventListener('click', () => {
    document.getElementById('memCreateForm').classList.remove('visible');
  });
  document.getElementById('btnSaveNewMem').addEventListener('click', async () => {
    const content = document.getElementById('newMemContent').value.trim();
    const tags    = document.getElementById('newMemTags').value;
    const imp     = document.getElementById('newMemImp').value;
    const type    = document.getElementById('newMemType').value;
    const fb      = document.getElementById('newMemFeedback');
    if (!content) { fb.textContent = 'El contenido es obligatorio'; fb.className = 'admin-feedback err'; return; }
    document.getElementById('btnSaveNewMem').disabled = true;
    try {
      const res = await fetch(`${BAKO_URL}/api/agent/memories/import`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ memories: [{ content, type, importance: imp, tags: tags.split(',').map(t=>t.trim()).filter(Boolean) }] }),
      });
      if (res.ok) {
        fb.textContent = '✓ Guardada'; fb.className = 'admin-feedback ok';
        document.getElementById('newMemContent').value = '';
        document.getElementById('newMemTags').value    = '';
        setTimeout(() => { document.getElementById('memCreateForm').classList.remove('visible'); fb.textContent = ''; }, 1200);
        await loadMemories();
      } else {
        fb.textContent = 'Error al guardar'; fb.className = 'admin-feedback err';
      }
    } catch { fb.textContent = 'Error de conexión'; fb.className = 'admin-feedback err'; }
    finally { document.getElementById('btnSaveNewMem').disabled = false; }

  // ── Estado ────────────────────────────────────────────────────────────────

  let audioChunks      = [];

  // ── Chat history ───────────────────────────────────────────────────────────
  function addMessage(role, text) {
    const div = document.createElement('div');

  function addStatusMsg(text) {

  // ── Utilidades UI ──────────────────────────────────────────────────────────
  function stripMd(t) {
    return t
      .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')
      .replace(/_{1,2}([^_]+)_{1,2}/g, '$1')
      .replace(/`{1,3}[^`]*`{1,3}/g, '')
      .replace(/#{1,6}\s+/g, '')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/\*/g, '').replace(/_/g, '');
  }

  function setStatus(msg, cls = '') {
    statusBar.textContent = msg;
    statusBar.className = 'status-bar' + (cls ? ' ' + cls : '');
  }

  function setMicState(state) {
    micState = state;
    micBtn.className = 'mic-btn' + (state !== 'idle' ? ' ' + state : '');
    micLabel.textContent = ({ recording: 'Suelta', processing: 'Parar', playing: 'Parar', stopping: 'Parando', cooldown: 'Espera', idle: 'Mantén' })[state] || 'Mantén';
    const iconEl = micBtn.querySelector('.mic-icon');
    if (iconEl) {
      const isStop = state === 'processing' || state === 'playing' || state === 'stopping';
      iconEl.innerHTML  = isStop ? SVG_STOP : SVG_MIC;
      iconEl.style.color = isStop ? 'var(--red)' : (state === 'recording' ? 'var(--green)' : '');
    }
    micBtn.title = (state === 'processing' || state === 'playing') ? 'Toca para parar a BAKO' : 'Mantén para hablar';
    wave.classList.toggle('active', state === 'recording');
  }

  // Cancela cualquier respuesta en curso (fetch o audio)
  function stopBako() {
    if (currentController) { currentController.abort(); currentController = null; }
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    setMicState('idle');
    setUiEnabled(true);
    setStatus('Interrumpido');
  }

  function setUiEnabled(enabled) {
    if (enabled && isCoolingDown()) return;
    // El mic button NUNCA se deshabilita cuando BAKO está activo —
    // precisamente entonces sirve para interrumpirle.
    const bakoActive = micState === 'processing' || micState === 'playing';
    if (!bakoActive) {
      micBtn.style.pointerEvents = enabled ? '' : 'none';
      micBtn.style.opacity       = enabled ? '' : '0.4';
    } else {
      micBtn.style.pointerEvents = '';
      micBtn.style.opacity       = '';
    }
    textInput.disabled        = !enabled;
    btnSendText.disabled      = !enabled;
    btnSendReview.disabled    = !enabled;
    btnSendText.style.opacity = enabled ? '' : '0.4';
  }

  // ── Rate limit ─────────────────────────────────────────────────────────────
  function isCoolingDown() { return Date.now() < cooldownUntil; }

  function setCooldown(secs) {
    cooldownUntil = Date.now() + secs * 1000;
    setMicState('cooldown');
    micBtn.style.pointerEvents = 'none';
    micBtn.style.opacity       = '0.4';
    textInput.disabled         = true;
    btnSendText.disabled       = true;
    btnSendReview.disabled     = true;
    btnSendText.style.opacity  = '0.4';
    tickCooldown();
  }

  function tickCooldown() {
    const rem = Math.ceil((cooldownUntil - Date.now()) / 1000);
    if (rem > 0) {
      setStatus(`🚫 Rate limit — ${rem}s`, 'warn');
      setTimeout(tickCooldown, 1000);
    } else {
      cooldownUntil = 0;
      setMicState('idle');
      micBtn.style.pointerEvents = '';
      micBtn.style.opacity       = '';
      textInput.disabled         = false;
      btnSendText.disabled       = false;
      btnSendReview.disabled     = false;
      btnSendText.style.opacity  = '';
      setStatus('Listo');
    }
  }

  function parseCooldownSecs(data) {
    const m = JSON.stringify(data).match(/(\d+)\s*(?:s\b|sec|second|segundo)/i);
    return m ? Math.min(parseInt(m[1]), 120) : 30;
  }

  async function waitGapIfNeeded() {
    const elapsed = Date.now() - lastRequestMs;
    if (elapsed < MIN_GAP_MS) {
      await new Promise(r => setTimeout(r, MIN_GAP_MS - elapsed));
    }
  }

  // ── Grabación ──────────────────────────────────────────────────────────────
  async function startRecording() {
    if (isRecording || isCoolingDown()) return;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    cancelReview();

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
      audioChunks = [];
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start(100);
      isRecording = true;
      setMicState('recording');
      setStatus('Grabando…');
    } catch {
      setStatus('Sin acceso al micrófono', 'error');
    }
  }

  async function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    isRecording = false;
    mediaRecorder.stop();
    stream.getTracks().forEach(t => t.stop());
    setMicState('processing');
    setStatus('Transcribiendo…', 'warn');

    await new Promise(r => { mediaRecorder.onstop = r; });

    const blob = new Blob(audioChunks, { type: audioChunks[0]?.type || 'audio/webm' });
    if (blob.size < 500) { setMicState('idle'); setStatus('Listo'); return; }

    try {
      const form = new FormData();
      form.append('audio', blob, 'voice.webm');
      const res = await fetch(`${BAKO_URL}/api/desktop/transcribe`, {
        method: 'POST', body: form,
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });

      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        setCooldown(parseCooldownSecs(data));
        addStatusMsg('🚫 Rate limit activo — espera antes de hablar');
        setMicState('idle');
        return;
      }

      const data = await res.json();
      if (!res.ok || !data.transcription) {
        setMicState('idle');
        setStatus('No se detectó habla', 'error');
        return;
      }

      showReview(data.transcription.trim());
      setMicState('idle');
    } catch {
      setMicState('idle');
      setStatus('Error al transcribir', 'error');
    }
  }

  // ── Review panel ───────────────────────────────────────────────────────────
  function showReview(text) {
    reviewText.value = text;
    userEditing = false;
    reviewPanel.classList.add('visible');
    progressBar.style.transition = 'none';
    progressBar.style.width      = '100%';
    setStatus(`Revisa — enviando en ${REVIEW_SECS}s`, 'warn');
    void progressBar.offsetWidth;
    progressBar.style.transition = `width ${REVIEW_SECS}s linear`;
    progressBar.style.width      = '0%';
    startCountdown();
  }

  function startCountdown() {
    stopCountdown();
    countdownVal = REVIEW_SECS;
    tickReview();
  }

  function tickReview() {
    if (countdownVal <= 0) { sendReview(); return; }
    reviewCD.textContent = countdownVal + 's';
    countdownVal--;
    countdownTimer = setTimeout(tickReview, 1000);
  }

  function stopCountdown() {
    if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  }

  function cancelReview() {
    stopCountdown();
    reviewPanel.classList.remove('visible');
    if (!isCoolingDown()) setStatus('Listo');
  }

  function sendReview() {
    const text = reviewText.value.trim();
    cancelReview();
    if (text && !isCoolingDown()) sendMessage(text);
  }

  reviewText.addEventListener('input', () => {
    if (!userEditing) {
      userEditing = true;
      stopCountdown();
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
      reviewCD.textContent = '✏️';
      setStatus('Editado — pulsa Enviar', 'ok');
    }
  });
  reviewText.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReview(); }
  });
  btnSendReview.addEventListener('click', sendReview);
  btnCancel.addEventListener('click',    cancelReview);

  // ── Input de texto ──────────────────────────────────────────────────────────
  function sendTextInput() {
    if (isCoolingDown()) return;
    const text = textInput.value.trim();
    if (!text) return;
    textInput.value = '';
    sendMessage(text);

  btnSendText.addEventListener('click', sendTextInput);
  textInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendTextInput(); }
  });

  // ── Envío a BAKO ───────────────────────────────────────────────────────────
  async function sendMessage(text) {
    if (isCoolingDown()) return;

    await waitGapIfNeeded();

    addMessage('user', text);
    const loadingEl = addStatusMsg('⏳ BAKO está pensando…');
    setMicState('processing');  // PRIMERO el estado, LUEGO deshabilitar UI
    setUiEnabled(false);        // así setUiEnabled ve micState='processing' y deja el mic clickable
    setStatus('Enviando…', 'warn');

    currentController = new AbortController();

    try {
      const res = await fetch(`${BAKO_URL}/api/desktop/text`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ message: text }),
        signal: currentController.signal,
      });
      currentController = null;
      lastRequestMs = Date.now();
      loadingEl.remove();

      if (res.status === 401) {
        doLogout();
        return;
      }

      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        const secs = parseCooldownSecs(data);
        setCooldown(secs);
        addStatusMsg(`🚫 Rate limit — próximo mensaje en ${secs}s`);
        return;
      }

      if (res.status === 413) {
        addStatusMsg('⚠️ El contexto es demasiado grande. Intenta de nuevo en un momento.');
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
        return;
      }

      const data = await res.json();

      if (!res.ok) {
        addStatusMsg(`⚠️ ${data.error || 'Error del servidor'}`);
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
        return;
      }

      const responseText = stripMd(data.response || '');
      if (responseText) addMessage('bako', responseText);

      if (data.audio) {
        setMicState('playing');
        setStatus('BAKO está hablando…', 'ok');
        const bytes = atob(data.audio);
        const arr   = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: 'audio/webm' }));
        currentAudio = new Audio(url);
        currentAudio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; setMicState('idle'); setStatus('Listo'); setUiEnabled(true); };
        currentAudio.onerror  = () => { currentAudio = null; setMicState('idle'); setUiEnabled(true); setStatus('Listo'); };
        await currentAudio.play().catch(() => {});
      } else {
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
      }

    } catch (err) {
      currentController = null;
      loadingEl?.remove();
      if (err && err.name === 'AbortError') {
        // Interrumpido por el usuario — no mostrar error
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
        return;
      }
      addStatusMsg('⚠️ Sin conexión con BAKO');
      setMicState('idle');
      if (!isCoolingDown()) { setUiEnabled(true); setStatus('Sin conexión', 'error'); }
    }
  }

  // ── Touch / Mouse del mic (inline) ────────────────────────────────────────
  function handleMicPress(e) {
    // Si BAKO está procesando o reproduciendo → interrumpir
    if (micState === 'processing' || micState === 'playing') {
      stopBako();
      return;

    if (isCoolingDown()) return;
    startRecording();
  }

  function handleMicRelease() {

    presetPanel.classList.add('visible');
    presetOverlay.classList.add('visible');
    btnPresets.classList.add('open');
  }

  function closePresets() {
    presetPanel.classList.remove('visible');
    presetOverlay.classList.remove('visible');
    btnPresets.classList.remove('open');
  }

  btnPresets.addEventListener('click', () => {
    presetPanel.classList.contains('visible') ? closePresets() : openPresets();
  });
  presetOverlay.addEventListener('click', closePresets);

  // Inicializar icono mic con SVG (el HTML empieza vacío para evitar emoji feo)
  setMicState('idle');

  // ── Init — verificar sesión ───────────────────────────────────────────────

  (async function initAuth() {
    const token = getToken();
    const user  = getAuthUser();
    if (!token) { showLoginScreen(); return; }
    // Verificar que el token sigue siendo válido
    try {
      const res = await fetch(`${BAKO_URL}/api/auth/users`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (res.status === 401) { doLogout(); return; }
    } catch { /* sin conexión — mostrar chat de todos modos */ }
    showApp(user);
    addMessage('bako', '¿En qué puedo ayudarle, señor?');
  })();

  window.addEventListener('load', () => {
    if (navigator.mediaDevices) {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(s => s.getTracks().forEach(t => t.stop()))
        .catch(() => {});
    }
  });
</script>
</body>
</html>
