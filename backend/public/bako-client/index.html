<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BAKO">
  <meta name="theme-color" id="metaTheme" content="#0a0a0a">
  <link rel="manifest" href="/bako-client/manifest.json">
  <link rel="apple-touch-icon" href="/bako-client/icon-192.png">
  <title>BAKO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* ── Modo oscuro (por defecto) ──────────────────────────────────────────── */
    :root,
    html.dark {
      --bg:          #0a0a0a;
      --bg2:         #111111;
      --bg3:         #1a1a1a;
      --border:      #2a2a2a;
      --text:        #e8e8e8;
      --dim:         #555;
      --blue:        #4a9eff;
      --green:       #10b981;
      --yellow:      #f59e0b;
      --red:         #ef4444;
      --bubble-bako: #0e1e32;
      --bubble-user: #0d2b1a;
      --bubble-bako-text: #c8dff8;
      --bubble-user-text: #a8e6c8;
      color-scheme: dark;
    }

    /* ── Modo claro ──────────────────────────────────────────────────────────── */
    html.light {
      --bg:          #fdfefe;
      --bg2:         #f0f2f4;
      --bg3:         #e6e9ec;
      --border:      #d0d4d8;
      --text:        #1a1a1a;
      --dim:         #888;
      --blue:        #0078d4;
      --green:       #059669;
      --yellow:      #d97706;
      --red:         #dc2626;
      --bubble-bako: #dbeafe;
      --bubble-user: #d1fae5;
      --bubble-bako-text: #1e3a5f;
      --bubble-user-text: #1a3a28;
      color-scheme: light;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 10px;
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: border-color 0.3s ease;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 5px; color: var(--text); }
    .header p  { font-size: 10px; color: var(--dim); margin-left: 10px; letter-spacing: 2px; }

    .theme-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--blue); color: var(--blue); }
    .theme-toggle svg   { width: 18px; height: 18px; display: block; }

    /* ── Chat history ────────────────────────────────────────────────────────── */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      transition: background 0.3s ease;
    }
    .chat-history::-webkit-scrollbar { width: 3px; }
    .chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Burbujas de mensaje */
    .msg {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 88%;
      animation: fadeIn 0.2s ease;
    }
    .msg.bako { align-self: flex-start; }
    .msg.user { align-self: flex-end;   flex-direction: row-reverse; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.bako .msg-bubble {
      background: var(--bubble-bako);
      border-bottom-left-radius: 4px;
      color: var(--bubble-bako-text);
      transition: background 0.3s ease, color 0.3s ease;
    }
    .msg.user .msg-bubble {
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
      color: var(--bubble-user-text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .msg-reuse {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--dim);
      font-size: 13px;
      padding: 3px 7px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
      margin-bottom: 2px;
      line-height: 1;
    }
    .msg:hover .msg-reuse,
    .msg:focus-within .msg-reuse { opacity: 1; }

    /* Burbuja de estado (grabando, procesando...) */
    .msg-status {
      align-self: center;
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 1px;
    }

    /* ── Wave (entre chat y controles) ─────────────────────────────────────── */
    .wave-row {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 32px;
    }
    .wave {
      display: flex;
      gap: 4px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .wave.active { opacity: 1; }
    .wave span {
      display: block; width: 3px; border-radius: 2px; background: var(--blue);
      animation: wave 0.8s infinite ease-in-out;
    }
    .wave span:nth-child(1) { height: 8px;  animation-delay: 0s; }
    .wave span:nth-child(2) { height: 18px; animation-delay: 0.1s; }
    .wave span:nth-child(3) { height: 26px; animation-delay: 0.2s; }
    .wave span:nth-child(4) { height: 18px; animation-delay: 0.3s; }
    .wave span:nth-child(5) { height: 8px;  animation-delay: 0.4s; }
    @keyframes wave { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

    /* ── Panel de revisión ───────────────────────────────────────────────────── */
    .review-panel {
      display: none;
      flex-shrink: 0;
      background: var(--bg3);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      transition: background 0.3s ease;
    }
    .review-panel.visible { display: block; }

    .review-label {
      font-size: 11px; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; justify-content: space-between; margin-bottom: 6px;
    }
    .review-countdown { color: var(--yellow); font-weight: 600; }

    .review-progress { height: 2px; background: var(--border); border-radius: 1px; margin-bottom: 8px; overflow: hidden; }
    .review-progress-bar { height: 100%; background: var(--yellow); border-radius: 1px; transition: width 1s linear; width: 100%; }

    .review-text {
      width: 100%; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 11px; color: var(--text); font-size: 15px;
      font-family: inherit; resize: none; outline: none; min-height: 38px;
    }
    .review-text:focus { border-color: var(--blue); }

    .review-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .btn-cancel      { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--dim); font-size: 13px; padding: 6px 12px; cursor: pointer; }
    .btn-send-review { background: var(--blue); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; padding: 6px 18px; cursor: pointer; }

    /* ── Panel inferior ─────────────────────────────────────────────────────── */
    .bottom {
      flex-shrink: 0;
      padding: 10px 14px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .text-row { display: flex; width: 100%; gap: 6px; align-items: center; }
    .text-input {
      flex: 1; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 22px;
      padding: 10px 16px; color: var(--text);
      font-size: 15px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .text-input::placeholder { color: var(--dim); }
    .text-input:focus { border-color: var(--blue); }

    .btn-send-text {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--blue); border: none; color: #fff;
      font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-send-text:active { opacity: 0.8; transform: scale(0.93); }
    .btn-send-text:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Mic inline en la fila de texto */
    .mic-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--bg3); border: 2px solid var(--border);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: all 0.2s; user-select: none; -webkit-user-select: none;
      position: relative; flex-shrink: 0;
    }
    .mic-btn.recording { background: #0d2b0d; border-color: var(--green); }
    .mic-btn.recording::before {
      content: ''; position: absolute; width: 56px; height: 56px;
      border-radius: 50%; border: 2px solid #10b98155; animation: pulse 1.2s infinite;
    }
    /* Procesando o reproduciendo → rojo claro, mismo esquema para ambos: "toca para parar" */
    .mic-btn.processing,
    .mic-btn.playing    { border-color: var(--red); background: rgba(239,68,68,0.18); color: var(--red); cursor: pointer; animation: micPulse 1.2s ease-in-out infinite; }
    .mic-btn.cooldown   { border-color: var(--red); opacity: 0.5; cursor: not-allowed; }
    .mic-btn.stopping   { border-color: var(--red); background: rgba(239,68,68,0.18); }
    .mic-icon svg       { width: 18px; height: 18px; pointer-events: none; display: block; }
    @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0.35); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

    .mic-icon  { font-size: 18px; pointer-events: none; }
    .mic-label { display: none; } /* etiqueta oculta — solo se usa internamente */

    .status-bar { font-size: 12px; color: var(--dim); text-align: center; min-height: 15px; }
    .status-bar.warn  { color: var(--yellow); }
    .status-bar.error { color: var(--red); }
    .status-bar.ok    { color: var(--green); }

    /* ── Login ──────────────────────────────────────────────────────────────── */
    .login-screen {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: var(--bg); flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    .login-screen.visible { display: flex; }
    .login-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px;
      width: min(320px, 90vw); display: flex; flex-direction: column; gap: 14px;
    }
    .login-logo { text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 6px; }
    .login-sub  { text-align: center; font-size: 11px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-top: -8px; }
    .login-input {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 14px; color: var(--text); font-size: 15px; font-family: inherit; outline: none;
    }
    .login-input:focus { border-color: var(--blue); }
    .login-btn {
      background: var(--blue); border: none; border-radius: 10px;
      color: #fff; font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer; margin-top: 4px;
    }
    .login-btn:active { opacity: 0.85; }
    .login-error { font-size: 13px; color: var(--red); text-align: center; min-height: 18px; }

    /* ── Admin panel ─────────────────────────────────────────────────────────── */
    .btn-admin {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px;
      cursor: pointer; color: var(--dim); display: none;
      align-items: center; justify-content: center; transition: border-color 0.2s, color 0.2s;
    }
    .btn-admin.visible { display: flex; }
    .btn-admin:hover { border-color: var(--blue); color: var(--blue); }
    .btn-admin svg { width: 18px; height: 18px; display: block; }

    .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20; }
    .admin-overlay.visible { display: block; }
    .admin-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100vw);
      background: var(--bg2); border-left: 1px solid var(--border);
      padding: 20px 18px; z-index: 21; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    .admin-panel.visible { transform: translateX(0); }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .admin-title  { font-size: 16px; font-weight: 600; }
    .admin-close  { background: none; border: none; color: var(--dim); font-size: 22px; cursor: pointer; line-height: 1; }
    .admin-section-title { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; margin-top: 18px; }
    .user-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    }
    .user-info { flex: 1; }
    .user-name  { font-size: 14px; font-weight: 500; }
    .user-meta  { font-size: 12px; color: var(--dim); }
    .user-item.inactive .user-name { color: var(--dim); text-decoration: line-through; }
    .btn-user-action {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; font-size: 11px; cursor: pointer; color: var(--dim); transition: all 0.15s;
    }
    .btn-user-action.toggle:hover { border-color: var(--yellow); color: var(--yellow); }
    .btn-user-action.del:hover    { border-color: var(--red);    color: var(--red); }
    .create-user-form {
      display: flex; flex-direction: column; gap: 10px;
      padding: 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
    }
    .admin-input {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    .admin-input:focus { border-color: var(--blue); }
    .admin-select {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; cursor: pointer;
    }
    .btn-create-user {
      background: var(--blue); border: none; border-radius: 8px;
      color: #fff; font-size: 14px; font-weight: 600; padding: 10px; cursor: pointer;
    }
    .admin-feedback { font-size: 12px; text-align: center; min-height: 16px; }
    .admin-feedback.ok  { color: var(--green); }
    .admin-feedback.err { color: var(--red); }
    .logout-btn {
      display: block; width: 100%; background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; color: var(--red); font-size: 14px;
      cursor: pointer; margin-top: 20px; transition: border-color 0.2s;
    }
    .logout-btn:hover { border-color: var(--red); }

    /* ── Contraseña visible ─────────────────────────────────────────────────── */
    .pass-wrap { position: relative; display: flex; align-items: center; }
    .pass-wrap input { flex: 1; padding-right: 40px; }
    .eye-btn {
      position: absolute; right: 8px;
      background: none; border: none; cursor: pointer;
      color: var(--dim); padding: 4px; transition: color 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .eye-btn:hover { color: var(--text); }
    .eye-btn svg { width: 18px; height: 18px; display: block; pointer-events: none; }

    /* ── Botón presets ──────────────────────────────────────────────────────── */
    .btn-presets {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-size: 17px; cursor: pointer;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-presets:active, .btn-presets.open { border-color: var(--blue); background: var(--bg2); }

    /* ── Panel de presets (bottom sheet) ────────────────────────────────────── */
    .preset-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 10;
    }
    .preset-overlay.visible { display: block; }

    .preset-panel {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--bg2); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 6px 14px 180px;
      max-height: 68vh; overflow-y: auto;
      z-index: 11;
      transform: translateY(100%);
      transition: transform 0.26s cubic-bezier(.4,0,.2,1);
    }
    .preset-panel.visible { transform: translateY(0); }

    .preset-handle {
      width: 36px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 8px auto 12px;
    }
    .preset-title {
      font-size: 12px; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1.5px;
      text-align: center; margin-bottom: 14px;
    }
    .preset-category { margin-bottom: 14px; }
    .preset-cat-label {
      font-size: 11px; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 7px;
    }
    .preset-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .preset-chip {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 13px;
      font-size: 13px; color: var(--text); cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none; -webkit-user-select: none;
    }
    .preset-chip:active { background: var(--blue); border-color: var(--blue); color: #fff; }
  </style>
</head>
<body>

<!-- ── Login screen ──────────────────────────────────────────────────────── -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">BAKO</div>
    <div class="login-sub">Mayordomo Personal</div>
    <input class="login-input" id="loginUser" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="none">
    <div class="pass-wrap">
      <input class="login-input" id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%">
      <button class="eye-btn" type="button" data-target="loginPass" title="Mostrar/ocultar"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
    </div>
    <button class="login-btn" id="loginBtn">Acceder</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ── Admin overlay + panel ─────────────────────────────────────────────── -->
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <span class="admin-title">⚙️ Gestión de usuarios</span>
    <button class="admin-close" id="adminClose">✕</button>
  </div>
  <div class="admin-section-title">Usuarios activos</div>
  <div id="userList"></div>
  <div class="admin-section-title">Crear usuario</div>
  <div class="create-user-form">
    <input class="admin-input" id="newUserName" type="text" placeholder="Nombre de usuario" autocapitalize="none">
    <div class="pass-wrap">
      <input class="admin-input" id="newUserPass" type="password" placeholder="Contraseña" style="width:100%">
      <button class="eye-btn" type="button" data-target="newUserPass" title="Mostrar/ocultar"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
    </div>
    <select class="admin-select" id="newUserRole">
      <option value="user">Usuario</option>
      <option value="superadmin">Superadmin</option>
    </select>
    <button class="btn-create-user" id="btnCreateUser">Crear usuario</button>
    <div class="admin-feedback" id="adminFeedback"></div>
  </div>
  <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
</div>

<div class="header">
  <button class="btn-admin" id="btnAdmin" title="Gestión de usuarios">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
  </button>
  <h1>BAKO</h1>
  <p>MAYORDOMO PERSONAL</p>
  <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
    <!-- Icono luna (visible en modo oscuro → click para ir a claro) -->
    <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
    </svg>
    <!-- Icono sol (visible en modo claro → click para ir a oscuro) -->
    <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="display:none">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364l-1.414-1.414M7.05 7.05L5.636 5.636m12.728 0l-1.414 1.414M7.05 16.95l-1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z"/>
    </svg>
  </button>
</div>

<!-- Chat history -->
<div class="chat-history" id="chatHistory"></div>

<!-- Wave (estado de grabación — compacto sobre el input) -->
<div class="wave-row">
  <div class="wave" id="wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<!-- Panel de revisión de transcripción -->
<div class="review-panel" id="reviewPanel">
  <div class="review-label">
    <span>📝 Revisa tu mensaje</span>
    <span class="review-countdown" id="reviewCountdown">5s</span>
  </div>
  <div class="review-progress"><div class="review-progress-bar" id="progressBar"></div></div>
  <textarea class="review-text" id="reviewText" rows="2"></textarea>
  <div class="review-actions">
    <button class="btn-cancel" id="btnCancel">✕ Cancelar</button>
    <button class="btn-send-review" id="btnSendReview">➤ Enviar</button>
  </div>
</div>

<!-- Overlay para cerrar el panel de presets -->
<div class="preset-overlay" id="presetOverlay"></div>

<!-- Panel de presets (bottom sheet) -->
<div class="preset-panel" id="presetPanel">
  <div class="preset-handle"></div>
  <div class="preset-title">Comandos rápidos</div>
  <div id="presetContent"></div>
</div>

<div class="bottom">
  <!-- Fila única: ⚡ | input texto | 🎤 mic/stop | ➤ enviar -->
  <div class="text-row">
    <button class="btn-presets" id="btnPresets" title="Comandos rápidos">⚡</button>
    <input class="text-input" id="textInput" type="text" placeholder="Escribe un mensaje…" autocomplete="off">
    <button class="mic-btn" id="micBtn" title="Mantén para hablar">
      <span class="mic-icon"></span>
      <span class="mic-label" id="micLabel">Mantén</span>
    </button>
    <button class="btn-send-text" id="btnSendText">➤</button>
  </div>
  <div class="status-bar" id="statusBar">Listo</div>
</div>

<script>
  // ── Tema (mismo patrón que bohdeveloper.com) ──────────────────────────────
  const iconMoon    = document.getElementById('iconMoon');
  const iconSun     = document.getElementById('iconSun');
  const metaTheme   = document.getElementById('metaTheme');

  function applyTheme(theme) {
    const html = document.documentElement;
    if (theme === 'light') {
      html.classList.add('light');
      html.classList.remove('dark');
      iconMoon.style.display = 'none';
      iconSun.style.display  = 'block';
      metaTheme.content = '#fdfefe';
    } else {
      html.classList.add('dark');
      html.classList.remove('light');
      iconMoon.style.display = 'block';
      iconSun.style.display  = 'none';
      metaTheme.content = '#0a0a0a';
    }
  }

  // Cargar preferencia guardada (default: dark)
  applyTheme(localStorage.getItem('bako-theme') || 'dark');

  document.getElementById('themeToggle').addEventListener('click', () => {
    const current  = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    const newTheme = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem('bako-theme', newTheme);
    applyTheme(newTheme);
  });

  // ─────────────────────────────────────────────────────────────────────────
  const BAKO_URL    = window.location.origin;
  const REVIEW_SECS = 5;
  const MIN_GAP_MS  = 3000;

  // ── Auth ──────────────────────────────────────────────────────────────────
  const loginScreen  = document.getElementById('loginScreen');
  const loginUserEl  = document.getElementById('loginUser');
  const loginPassEl  = document.getElementById('loginPass');
  const loginBtn     = document.getElementById('loginBtn');
  const loginError   = document.getElementById('loginError');
  const btnAdmin     = document.getElementById('btnAdmin');
  const adminPanel   = document.getElementById('adminPanel');
  const adminOverlay = document.getElementById('adminOverlay');
  const adminClose   = document.getElementById('adminClose');
  const userList     = document.getElementById('userList');
  const newUserName  = document.getElementById('newUserName');
  const newUserPass  = document.getElementById('newUserPass');
  const newUserRole  = document.getElementById('newUserRole');
  const btnCreateUser= document.getElementById('btnCreateUser');
  const adminFeedback= document.getElementById('adminFeedback');
  const logoutBtn    = document.getElementById('logoutBtn');

  function getToken()    { return localStorage.getItem('bako-token') || ''; }
  function getAuthUser() { try { return JSON.parse(localStorage.getItem('bako-user') || 'null'); } catch { return null; } }

  function authHeaders(extra = {}) {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}`, ...extra };
  }

  function showLoginScreen() {
    loginScreen.classList.add('visible');
    loginError.textContent = '';
    loginUserEl.value = '';
    loginPassEl.value = '';
    setTimeout(() => loginUserEl.focus(), 100);
  }

  function showApp(user) {
    loginScreen.classList.remove('visible');
    if (user?.role === 'superadmin') btnAdmin.classList.add('visible');
    else btnAdmin.classList.remove('visible');
  }

  async function doLogin() {
    const username = loginUserEl.value.trim();
    const password = loginPassEl.value;
    if (!username || !password) { loginError.textContent = 'Rellena usuario y contraseña'; return; }
    loginBtn.disabled = true; loginBtn.textContent = 'Accediendo…';
    try {
      const res = await fetch(`${BAKO_URL}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { loginError.textContent = data.error || 'Error al acceder'; return; }
      localStorage.setItem('bako-token', data.token);
      localStorage.setItem('bako-user', JSON.stringify(data.user));
      showApp(data.user);
    } catch {
      loginError.textContent = 'Sin conexión con BAKO';
    } finally {
      loginBtn.disabled = false; loginBtn.textContent = 'Acceder';
    }
  }

  function doLogout() {
    localStorage.removeItem('bako-token');
    localStorage.removeItem('bako-user');
    closeAdmin();
    showLoginScreen();
  }

  // SVG icono stop (cuadrado rojo — visible en el botón mic al interrumpir)
  const SVG_STOP = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>`;
  const SVG_MIC  = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/></svg>`;

  // SVG ojo abierto (contraseña oculta → pulsar para ver)
  const SVG_EYE_OPEN = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`;
  // SVG ojo tachado (contraseña visible → pulsar para ocultar)
  const SVG_EYE_OFF  = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>`;

  function togglePassVisibility(inp, btn) {
    const show = inp.type === 'password';
    inp.type       = show ? 'text' : 'password';
    btn.innerHTML  = show ? SVG_EYE_OFF : SVG_EYE_OPEN;
  }
  // Delegar en todos los .eye-btn con data-target (login + crear usuario)
  document.addEventListener('click', e => {
    const btn = e.target.closest('.eye-btn[data-target]');
    if (!btn) return;
    const inp = document.getElementById(btn.dataset.target);
    if (inp) togglePassVisibility(inp, btn);
  });

  loginBtn.addEventListener('click', doLogin);
  loginPassEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  loginUserEl.addEventListener('keydown', e => { if (e.key === 'Enter') loginPassEl.focus(); });
  logoutBtn.addEventListener('click', doLogout);

  // ── Admin panel ───────────────────────────────────────────────────────────
  function openAdmin() {
    adminPanel.classList.add('visible');
    adminOverlay.classList.add('visible');
    loadUsers();
  }
  function closeAdmin() {
    adminPanel.classList.remove('visible');
    adminOverlay.classList.remove('visible');
  }

  btnAdmin.addEventListener('click', openAdmin);
  adminClose.addEventListener('click', closeAdmin);
  adminOverlay.addEventListener('click', closeAdmin);

  async function loadUsers() {
    userList.innerHTML = '<div style="color:var(--dim);font-size:13px">Cargando…</div>';
    try {
      const res  = await fetch(`${BAKO_URL}/api/auth/users`, { headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) { userList.innerHTML = `<div style="color:var(--red)">${data.error}</div>`; return; }
      if (!data.users.length) { userList.innerHTML = '<div style="color:var(--dim);font-size:13px">Sin usuarios</div>'; return; }
      userList.innerHTML = '';
      data.users.forEach(u => {
        const item = document.createElement('div');
        item.className = 'user-item' + (u.active ? '' : ' inactive');
        item.innerHTML = `
          <div class="user-info">
            <div class="user-name">${u.username}</div>
            <div class="user-meta">${u.role} · ${u.active ? 'activo' : 'inactivo'}</div>
          </div>
          <button class="btn-user-action edit"   data-id="${u._id}" data-name="${u.username}" title="Editar">✏️</button>
          ${u.role !== 'superadmin' ? `
            <button class="btn-user-action toggle" data-id="${u._id}" title="${u.active ? 'Desactivar' : 'Activar'}">${u.active ? '🔒' : '🔓'}</button>
            <button class="btn-user-action del"    data-id="${u._id}" title="Eliminar">🗑</button>
          ` : ''}
        `;
        userList.appendChild(item);
      });
      userList.querySelectorAll('.edit').forEach(btn => btn.addEventListener('click', e => {
        openEditForm(e.currentTarget.dataset.id, e.currentTarget.dataset.name);
      }));
      userList.querySelectorAll('.toggle').forEach(btn => btn.addEventListener('click', async e => {
        const id  = e.currentTarget.dataset.id;
        const res = await fetch(`${BAKO_URL}/api/auth/users/${id}/toggle`, { method: 'PATCH', headers: authHeaders() });
        if (res.ok) loadUsers();
      }));
      userList.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', async e => {
        if (!confirm('¿Eliminar usuario?')) return;
        const id  = e.currentTarget.dataset.id;
        const res = await fetch(`${BAKO_URL}/api/auth/users/${id}`, { method: 'DELETE', headers: authHeaders() });
        if (res.ok) loadUsers();
      }));
    } catch {
      userList.innerHTML = '<div style="color:var(--red)">Error al cargar usuarios</div>';
    }
  }

  btnCreateUser.addEventListener('click', async () => {
    const username = newUserName.value.trim();
    const password = newUserPass.value;
    const role     = newUserRole.value;
    if (!username || !password) { setAdminFeedback('Rellena usuario y contraseña', false); return; }
    btnCreateUser.disabled = true;
    try {
      const res  = await fetch(`${BAKO_URL}/api/auth/users`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ username, password, role }),
      });
      const data = await res.json();
      if (!res.ok) { setAdminFeedback(data.error, false); return; }
      setAdminFeedback(`✓ ${data.user.username} creado`, true);
      newUserName.value = ''; newUserPass.value = '';
      loadUsers();
    } catch {
      setAdminFeedback('Error de conexión', false);
    } finally {
      btnCreateUser.disabled = false;
    }
  });

  function setAdminFeedback(msg, ok) {
    adminFeedback.textContent = msg;
    adminFeedback.className   = 'admin-feedback ' + (ok ? 'ok' : 'err');
    setTimeout(() => { adminFeedback.textContent = ''; adminFeedback.className = 'admin-feedback'; }, 3000);
  }

  // ── Edición inline de usuario ─────────────────────────────────────────────
  let editingId = null;

  function openEditForm(id, currentName) {
    // Si ya hay un form abierto para este usuario, cerrarlo
    const existing = document.getElementById('edit-form-' + id);
    if (existing) { existing.remove(); editingId = null; return; }
    // Cerrar cualquier otro form abierto
    document.querySelectorAll('.edit-inline-form').forEach(f => f.remove());
    editingId = id;

    const item = document.querySelector(`.edit[data-id="${id}"]`)?.closest('.user-item');
    if (!item) return;

    const form = document.createElement('div');
    form.id = 'edit-form-' + id;
    form.className = 'edit-inline-form create-user-form';
    form.style.marginTop = '6px';
    form.innerHTML = `
      <div style="font-size:12px;color:var(--dim);margin-bottom:2px">Editar: <strong>${currentName}</strong></div>
      <input class="admin-input edit-new-name" type="text" placeholder="Nuevo nombre de usuario" value="${currentName}" autocapitalize="none">
      <div class="pass-wrap">
        <input class="admin-input edit-new-pass" type="password" placeholder="Nueva contraseña (vacío = sin cambio)" style="width:100%">
        <button class="eye-btn edit-eye" type="button" title="Mostrar/ocultar"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-create-user edit-save-btn" style="flex:1">Guardar</button>
        <button class="btn-create-user edit-cancel-btn" style="flex:0 0 auto;background:var(--bg3);color:var(--text)">✕</button>
      </div>
      <div class="admin-feedback edit-feedback"></div>
    `;
    item.insertAdjacentElement('afterend', form);

    form.querySelector('.edit-cancel-btn').addEventListener('click', () => { form.remove(); editingId = null; });
    form.querySelector('.edit-eye').addEventListener('click', () => {
      const inp = form.querySelector('.edit-new-pass');
      togglePassVisibility(inp, form.querySelector('.edit-eye'));
    });

    form.querySelector('.edit-save-btn').addEventListener('click', async () => {
      const newName = form.querySelector('.edit-new-name').value.trim();
      const newPass = form.querySelector('.edit-new-pass').value;
      const fb      = form.querySelector('.edit-feedback');
      if (!newName && !newPass) { fb.textContent = 'Nada que guardar'; fb.className = 'admin-feedback edit-feedback err'; return; }

      form.querySelector('.edit-save-btn').disabled = true;
      const body = {};
      if (newName) body.username = newName;
      if (newPass) body.password = newPass;

      try {
        const res  = await fetch(`${BAKO_URL}/api/auth/users/${id}`, {
          method: 'PATCH', headers: authHeaders(), body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) { fb.textContent = data.error; fb.className = 'admin-feedback edit-feedback err'; form.querySelector('.edit-save-btn').disabled = false; return; }
        form.remove(); editingId = null;
        setAdminFeedback(`✓ ${data.user.username} actualizado`, true);
        loadUsers();
      } catch {
        fb.textContent = 'Error de conexión';
        fb.className = 'admin-feedback edit-feedback err';
        form.querySelector('.edit-save-btn').disabled = false;
      }
    });
  }

  // ── DOM ────────────────────────────────────────────────────────────────────
  const chatHistory   = document.getElementById('chatHistory');
  const wave          = document.getElementById('wave');
  const reviewPanel   = document.getElementById('reviewPanel');
  const reviewText    = document.getElementById('reviewText');
  const reviewCD      = document.getElementById('reviewCountdown');
  const progressBar   = document.getElementById('progressBar');
  const btnCancel     = document.getElementById('btnCancel');
  const btnSendReview = document.getElementById('btnSendReview');
  const textInput     = document.getElementById('textInput');
  const btnSendText   = document.getElementById('btnSendText');
  const micBtn        = document.getElementById('micBtn');
  const micLabel      = document.getElementById('micLabel');
  const statusBar     = document.getElementById('statusBar');
  const btnPresets    = document.getElementById('btnPresets');
  const presetPanel   = document.getElementById('presetPanel');
  const presetOverlay = document.getElementById('presetOverlay');
  const presetContent = document.getElementById('presetContent');

  // ── Estado ────────────────────────────────────────────────────────────────
  let mediaRecorder    = null;
  let audioChunks      = [];
  let isRecording      = false;
  let stream           = null;
  let currentAudio     = null;
  let currentController = null;  // AbortController para cancelar fetch
  let micState         = 'idle'; // tracking del estado actual del mic
  let lastRequestMs    = 0;
  let cooldownUntil    = 0;
  let countdownTimer   = null;
  let countdownVal     = REVIEW_SECS;
  let userEditing      = false;

  // ── Chat history ───────────────────────────────────────────────────────────
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    const reuse = document.createElement('button');
    reuse.className = 'msg-reuse';
    reuse.title = 'Copiar al input';
    reuse.textContent = '↩';
    reuse.addEventListener('click', () => {
      textInput.value = text;
      textInput.focus();
      textInput.setSelectionRange(text.length, text.length);
    });

    div.appendChild(bubble);
    div.appendChild(reuse);
    chatHistory.appendChild(div);
    chatHistory.scrollTop = chatHistory.scrollHeight;
    return div;
  }

  function addStatusMsg(text) {
    const div = document.createElement('div');
    div.className = 'msg-status';
    div.textContent = text;
    chatHistory.appendChild(div);
    chatHistory.scrollTop = chatHistory.scrollHeight;
    return div;
  }

  // ── Utilidades UI ──────────────────────────────────────────────────────────
  function stripMd(t) {
    return t
      .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')
      .replace(/_{1,2}([^_]+)_{1,2}/g, '$1')
      .replace(/`{1,3}[^`]*`{1,3}/g, '')
      .replace(/#{1,6}\s+/g, '')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/\*/g, '').replace(/_/g, '');
  }

  function setStatus(msg, cls = '') {
    statusBar.textContent = msg;
    statusBar.className = 'status-bar' + (cls ? ' ' + cls : '');
  }

  function setMicState(state) {
    micState = state;
    micBtn.className = 'mic-btn' + (state !== 'idle' ? ' ' + state : '');
    micLabel.textContent = ({ recording: 'Suelta', processing: 'Parar', playing: 'Parar', stopping: 'Parando', cooldown: 'Espera', idle: 'Mantén' })[state] || 'Mantén';
    const iconEl = micBtn.querySelector('.mic-icon');
    if (iconEl) {
      const isStop = state === 'processing' || state === 'playing' || state === 'stopping';
      iconEl.innerHTML  = isStop ? SVG_STOP : SVG_MIC;
      iconEl.style.color = isStop ? 'var(--red)' : (state === 'recording' ? 'var(--green)' : '');
    }
    micBtn.title = (state === 'processing' || state === 'playing') ? 'Toca para parar a BAKO' : 'Mantén para hablar';
    wave.classList.toggle('active', state === 'recording');
  }

  // Cancela cualquier respuesta en curso (fetch o audio)
  function stopBako() {
    if (currentController) { currentController.abort(); currentController = null; }
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    setMicState('idle');
    setUiEnabled(true);
    setStatus('Interrumpido');
  }

  function setUiEnabled(enabled) {
    if (enabled && isCoolingDown()) return;
    // El mic button NUNCA se deshabilita cuando BAKO está activo —
    // precisamente entonces sirve para interrumpirle.
    const bakoActive = micState === 'processing' || micState === 'playing';
    if (!bakoActive) {
      micBtn.style.pointerEvents = enabled ? '' : 'none';
      micBtn.style.opacity       = enabled ? '' : '0.4';
    } else {
      micBtn.style.pointerEvents = '';
      micBtn.style.opacity       = '';
    }
    textInput.disabled        = !enabled;
    btnSendText.disabled      = !enabled;
    btnSendReview.disabled    = !enabled;
    btnSendText.style.opacity = enabled ? '' : '0.4';
  }

  // ── Rate limit ─────────────────────────────────────────────────────────────
  function isCoolingDown() { return Date.now() < cooldownUntil; }

  function setCooldown(secs) {
    cooldownUntil = Date.now() + secs * 1000;
    setMicState('cooldown');
    micBtn.style.pointerEvents = 'none';
    micBtn.style.opacity       = '0.4';
    textInput.disabled         = true;
    btnSendText.disabled       = true;
    btnSendReview.disabled     = true;
    btnSendText.style.opacity  = '0.4';
    tickCooldown();
  }

  function tickCooldown() {
    const rem = Math.ceil((cooldownUntil - Date.now()) / 1000);
    if (rem > 0) {
      setStatus(`🚫 Rate limit — ${rem}s`, 'warn');
      setTimeout(tickCooldown, 1000);
    } else {
      cooldownUntil = 0;
      setMicState('idle');
      micBtn.style.pointerEvents = '';
      micBtn.style.opacity       = '';
      textInput.disabled         = false;
      btnSendText.disabled       = false;
      btnSendReview.disabled     = false;
      btnSendText.style.opacity  = '';
      setStatus('Listo');
    }
  }

  function parseCooldownSecs(data) {
    const m = JSON.stringify(data).match(/(\d+)\s*(?:s\b|sec|second|segundo)/i);
    return m ? Math.min(parseInt(m[1]), 120) : 30;
  }

  async function waitGapIfNeeded() {
    const elapsed = Date.now() - lastRequestMs;
    if (elapsed < MIN_GAP_MS) {
      await new Promise(r => setTimeout(r, MIN_GAP_MS - elapsed));
    }
  }

  // ── Grabación ──────────────────────────────────────────────────────────────
  async function startRecording() {
    if (isRecording || isCoolingDown()) return;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    cancelReview();

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
      audioChunks = [];
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start(100);
      isRecording = true;
      setMicState('recording');
      setStatus('Grabando…');
    } catch {
      setStatus('Sin acceso al micrófono', 'error');
    }
  }

  async function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    isRecording = false;
    mediaRecorder.stop();
    stream.getTracks().forEach(t => t.stop());
    setMicState('processing');
    setStatus('Transcribiendo…', 'warn');

    await new Promise(r => { mediaRecorder.onstop = r; });

    const blob = new Blob(audioChunks, { type: audioChunks[0]?.type || 'audio/webm' });
    if (blob.size < 500) { setMicState('idle'); setStatus('Listo'); return; }

    try {
      const form = new FormData();
      form.append('audio', blob, 'voice.webm');
      const res = await fetch(`${BAKO_URL}/api/desktop/transcribe`, {
        method: 'POST', body: form,
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });

      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        setCooldown(parseCooldownSecs(data));
        addStatusMsg('🚫 Rate limit activo — espera antes de hablar');
        setMicState('idle');
        return;
      }

      const data = await res.json();
      if (!res.ok || !data.transcription) {
        setMicState('idle');
        setStatus('No se detectó habla', 'error');
        return;
      }

      showReview(data.transcription.trim());
      setMicState('idle');
    } catch {
      setMicState('idle');
      setStatus('Error al transcribir', 'error');
    }
  }

  // ── Review panel ───────────────────────────────────────────────────────────
  function showReview(text) {
    reviewText.value = text;
    userEditing = false;
    reviewPanel.classList.add('visible');
    progressBar.style.transition = 'none';
    progressBar.style.width      = '100%';
    setStatus(`Revisa — enviando en ${REVIEW_SECS}s`, 'warn');
    void progressBar.offsetWidth;
    progressBar.style.transition = `width ${REVIEW_SECS}s linear`;
    progressBar.style.width      = '0%';
    startCountdown();
  }

  function startCountdown() {
    stopCountdown();
    countdownVal = REVIEW_SECS;
    tickReview();
  }

  function tickReview() {
    if (countdownVal <= 0) { sendReview(); return; }
    reviewCD.textContent = countdownVal + 's';
    countdownVal--;
    countdownTimer = setTimeout(tickReview, 1000);
  }

  function stopCountdown() {
    if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  }

  function cancelReview() {
    stopCountdown();
    reviewPanel.classList.remove('visible');
    if (!isCoolingDown()) setStatus('Listo');
  }

  function sendReview() {
    const text = reviewText.value.trim();
    cancelReview();
    if (text && !isCoolingDown()) sendMessage(text);
  }

  reviewText.addEventListener('input', () => {
    if (!userEditing) {
      userEditing = true;
      stopCountdown();
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
      reviewCD.textContent = '✏️';
      setStatus('Editado — pulsa Enviar', 'ok');
    }
  });
  reviewText.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReview(); }
  });
  btnSendReview.addEventListener('click', sendReview);
  btnCancel.addEventListener('click',    cancelReview);

  // ── Input de texto ──────────────────────────────────────────────────────────
  function sendTextInput() {
    if (isCoolingDown()) return;
    const text = textInput.value.trim();
    if (!text) return;
    textInput.value = '';
    sendMessage(text);
  }
  btnSendText.addEventListener('click', sendTextInput);
  textInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendTextInput(); }
  });

  // ── Envío a BAKO ───────────────────────────────────────────────────────────
  async function sendMessage(text) {
    if (isCoolingDown()) return;

    await waitGapIfNeeded();

    addMessage('user', text);
    const loadingEl = addStatusMsg('⏳ BAKO está pensando…');
    setMicState('processing');  // PRIMERO el estado, LUEGO deshabilitar UI
    setUiEnabled(false);        // así setUiEnabled ve micState='processing' y deja el mic clickable
    setStatus('Enviando…', 'warn');

    currentController = new AbortController();

    try {
      const res = await fetch(`${BAKO_URL}/api/desktop/text`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ message: text }),
        signal: currentController.signal,
      });
      currentController = null;
      lastRequestMs = Date.now();
      loadingEl.remove();

      if (res.status === 401) {
        doLogout();
        return;
      }

      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        const secs = parseCooldownSecs(data);
        setCooldown(secs);
        addStatusMsg(`🚫 Rate limit — próximo mensaje en ${secs}s`);
        return;
      }

      if (res.status === 413) {
        addStatusMsg('⚠️ El contexto es demasiado grande. Intenta de nuevo en un momento.');
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
        return;
      }

      const data = await res.json();

      if (!res.ok) {
        addStatusMsg(`⚠️ ${data.error || 'Error del servidor'}`);
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
        return;
      }

      const responseText = stripMd(data.response || '');
      if (responseText) addMessage('bako', responseText);

      if (data.audio) {
        setMicState('playing');
        setStatus('BAKO está hablando…', 'ok');
        const bytes = atob(data.audio);
        const arr   = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: 'audio/webm' }));
        currentAudio = new Audio(url);
        currentAudio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; setMicState('idle'); setStatus('Listo'); setUiEnabled(true); };
        currentAudio.onerror  = () => { currentAudio = null; setMicState('idle'); setUiEnabled(true); setStatus('Listo'); };
        await currentAudio.play().catch(() => {});
      } else {
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
      }

    } catch (err) {
      currentController = null;
      loadingEl?.remove();
      if (err && err.name === 'AbortError') {
        // Interrumpido por el usuario — no mostrar error
        setMicState('idle');
        setUiEnabled(true);
        setStatus('Listo');
        return;
      }
      addStatusMsg('⚠️ Sin conexión con BAKO');
      setMicState('idle');
      if (!isCoolingDown()) { setUiEnabled(true); setStatus('Sin conexión', 'error'); }
    }
  }

  // ── Touch / Mouse del mic (inline) ────────────────────────────────────────
  function handleMicPress(e) {
    // Si BAKO está procesando o reproduciendo → interrumpir
    if (micState === 'processing' || micState === 'playing') {
      stopBako();
      return;
    }
    if (isCoolingDown()) return;
    startRecording();
  }

  function handleMicRelease() {
    if (isRecording) stopRecording();
  }

  micBtn.addEventListener('touchstart',  e => { e.preventDefault(); handleMicPress(e);   }, { passive: false });
  micBtn.addEventListener('touchend',    e => { e.preventDefault(); handleMicRelease();   }, { passive: false });
  micBtn.addEventListener('touchcancel', e => { e.preventDefault(); handleMicRelease();   }, { passive: false });
  micBtn.addEventListener('mousedown',   handleMicPress);
  micBtn.addEventListener('mouseup',     handleMicRelease);
  micBtn.addEventListener('mouseleave',  () => { if (isRecording) stopRecording(); });

  (async function initAuth() {
    const token = getToken();
    const user  = getAuthUser();
    if (!token) { showLoginScreen(); return; }
    // Verificar que el token sigue siendo válido
    try {
      const res = await fetch(`${BAKO_URL}/api/auth/users`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (res.status === 401) { doLogout(); return; }
