<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BAKO">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/bako-client/manifest.json">
  <link rel="apple-touch-icon" href="/bako-client/icon-192.png">
  <title>BAKO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:      #0a0a0a;
      --bg2:     #111111;
      --bg3:     #1a1a1a;
      --border:  #2a2a2a;
      --text:    #e8e8e8;
      --dim:     #555;
      --blue:    #4a9eff;
      --green:   #10b981;
      --yellow:  #f59e0b;
      --red:     #ef4444;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .header {
      text-align: center;
      padding: 28px 24px 12px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 26px; font-weight: 700; letter-spacing: 6px; color: #fff; }
    .header p  { font-size: 11px; color: var(--dim); margin-top: 3px; letter-spacing: 3px; }

    /* ── Área central (chat) ────────────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px 24px;
      overflow: hidden;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .wave {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 40px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .wave.active { opacity: 1; }
    .wave span {
      display: block; width: 4px; border-radius: 2px; background: var(--blue);
      animation: wave 0.8s infinite ease-in-out;
    }
    .wave span:nth-child(1) { height: 12px; animation-delay: 0s; }
    .wave span:nth-child(2) { height: 28px; animation-delay: 0.1s; }
    .wave span:nth-child(3) { height: 40px; animation-delay: 0.2s; }
    .wave span:nth-child(4) { height: 28px; animation-delay: 0.3s; }
    .wave span:nth-child(5) { height: 12px; animation-delay: 0.4s; }
    @keyframes wave { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

    .transcription { font-size: 13px; color: var(--dim); font-style: italic; text-align: center; min-height: 20px; }
    .response      { font-size: 17px; color: var(--text); text-align: center; line-height: 1.65; }

    /* ── Panel de revisión de transcripción ─────────────────────────────────── */
    .review-panel {
      display: none;
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      flex-shrink: 0;
    }
    .review-panel.visible { display: block; }

    .review-label {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .review-countdown { color: var(--yellow); font-weight: 600; }

    .review-progress {
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .review-progress-bar {
      height: 100%;
      background: var(--yellow);
      border-radius: 1px;
      transition: width 1s linear;
      width: 100%;
    }

    .review-text {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 42px;
      line-height: 1.4;
      overflow: hidden;
    }
    .review-text:focus { border-color: var(--blue); }

    .review-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--dim);
      font-size: 13px;
      padding: 7px 14px;
      cursor: pointer;
    }
    .btn-send-review {
      background: var(--blue);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 7px 20px;
      cursor: pointer;
    }
    .btn-cancel:active     { opacity: 0.7; }
    .btn-send-review:active { opacity: 0.8; transform: scale(0.97); }

    /* ── Panel inferior ─────────────────────────────────────────────────────── */
    .bottom {
      flex-shrink: 0;
      padding: 10px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    /* Input de texto */
    .text-row {
      display: flex;
      width: 100%;
      gap: 8px;
      align-items: center;
    }
    .text-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 11px 18px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .text-input::placeholder { color: var(--dim); }
    .text-input:focus { border-color: var(--blue); }
    .btn-send-text {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-send-text:active { opacity: 0.8; transform: scale(0.93); }

    /* Botón micrófono */
    .mic-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--bg3);
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }
    .mic-btn.recording {
      background: #0d2b0d;
      border-color: var(--green);
    }
    .mic-btn.recording::before {
      content: '';
      position: absolute;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid #10b98144;
      animation: pulse 1.2s infinite;
    }
    .mic-btn.processing { border-color: var(--yellow); background: #1a1500; }
    .mic-btn.playing    { border-color: var(--green);  background: #0a1a0f; }
    .mic-btn.cooldown   { border-color: var(--red);    background: #1a0a0a; opacity: 0.7; cursor: not-allowed; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

    .mic-icon  { font-size: 32px; pointer-events: none; }
    .mic-label { font-size: 11px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; text-align: center; pointer-events: none; }

    /* Status bar */
    .status-bar {
      font-size: 12px;
      color: var(--dim);
      text-align: center;
      min-height: 16px;
    }
    .status-bar.warn  { color: var(--yellow); }
    .status-bar.error { color: var(--red); }
    .status-bar.ok    { color: var(--green); }

    /* Disabled state */
    .disabled-overlay { pointer-events: none; opacity: 0.4; }
  </style>
</head>
<body>

<div class="header">
  <h1>BAKO</h1>
  <p>MAYORDOMO PERSONAL</p>
</div>

<div class="chat-area">
  <div class="wave" id="wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="transcription" id="transcription"></div>
  <div class="response" id="response">¿En qué puedo ayudarle, señor?</div>
</div>

<!-- Panel de revisión de transcripción -->
<div class="review-panel" id="reviewPanel">
  <div class="review-label">
    <span>📝 Revisa tu mensaje</span>
    <span class="review-countdown" id="reviewCountdown">5s</span>
  </div>
  <div class="review-progress"><div class="review-progress-bar" id="progressBar"></div></div>
  <textarea class="review-text" id="reviewText" rows="2"></textarea>
  <div class="review-actions">
    <button class="btn-cancel" id="btnCancel">✕ Cancelar</button>
    <button class="btn-send-review" id="btnSendReview">➤ Enviar</button>
  </div>
</div>

<div class="bottom">
  <div class="text-row">
    <input class="text-input" id="textInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
    <button class="btn-send-text" id="btnSendText" title="Enviar texto">➤</button>
  </div>

  <button class="mic-btn" id="micBtn"
    ontouchstart="onTouchStart(event)" ontouchend="onTouchEnd(event)">
    <span class="mic-icon">🎤</span>
    <span class="mic-label" id="micLabel">Mantén</span>
  </button>

  <div class="status-bar" id="statusBar">Listo para hablar</div>
</div>

<script>
  const BAKO_URL = window.location.origin;
  const REVIEW_SECS  = 5;
  const MIN_GAP_MS   = 3000;

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const wave         = document.getElementById('wave');
  const transcDiv    = document.getElementById('transcription');
  const responseDiv  = document.getElementById('response');
  const reviewPanel  = document.getElementById('reviewPanel');
  const reviewText   = document.getElementById('reviewText');
  const reviewCD     = document.getElementById('reviewCountdown');
  const progressBar  = document.getElementById('progressBar');
  const btnCancel    = document.getElementById('btnCancel');
  const btnSendReview= document.getElementById('btnSendReview');
  const textInput    = document.getElementById('textInput');
  const btnSendText  = document.getElementById('btnSendText');
  const micBtn       = document.getElementById('micBtn');
  const micLabel     = document.getElementById('micLabel');
  const statusBar    = document.getElementById('statusBar');

  // ── Estado ────────────────────────────────────────────────────────────────
  let mediaRecorder  = null;
  let audioChunks    = [];
  let isRecording    = false;
  let stream         = null;
  let currentAudio   = null;
  let lastRequestMs  = 0;
  let cooldownUntil  = 0;
  let countdownTimer = null;
  let countdownVal   = REVIEW_SECS;
  let userEditing    = false;

  // ── Utilidades de UI ──────────────────────────────────────────────────────
  function setStatus(msg, cls = '') {
    statusBar.textContent = msg;
    statusBar.className = 'status-bar' + (cls ? ' ' + cls : '');
  }

  function setMicState(state) {
    micBtn.className = 'mic-btn' + (state !== 'idle' ? ' ' + state : '');
    const labels = { recording: 'Suelta', processing: 'Procesando', playing: 'BAKO habla', cooldown: 'Espera', idle: 'Mantén' };
    micLabel.textContent = labels[state] || 'Mantén';
    wave.classList.toggle('active', state === 'recording');
  }

  function setUiEnabled(enabled) {
    micBtn.style.pointerEvents  = enabled ? '' : 'none';
    micBtn.style.opacity        = enabled ? '' : '0.5';
    textInput.disabled          = !enabled;
    btnSendText.disabled        = !enabled;
    btnSendReview.disabled      = !enabled;
  }

  // ── Rate limit ────────────────────────────────────────────────────────────
  function isCoolingDown() { return Date.now() < cooldownUntil; }

  function setCooldown(secs) {
    cooldownUntil = Date.now() + secs * 1000;
    setMicState('cooldown');
    setUiEnabled(false);
    tickCooldown();
  }

  function tickCooldown() {
    const rem = Math.ceil((cooldownUntil - Date.now()) / 1000);
    if (rem > 0) {
      setStatus(`⏳ Rate limit — disponible en ${rem}s`, 'warn');
      setTimeout(tickCooldown, 1000);
    } else {
      setMicState('idle');
      setUiEnabled(true);
      setStatus('Listo para hablar');
    }
  }

  function parseCooldownSecs(text) {
    const m = text.match(/(\d+)\s*(?:s\b|sec|second|segundo)/i);
    return m ? Math.min(parseInt(m[1]), 120) : 30;
  }

  async function waitGapIfNeeded() {
    const elapsed = Date.now() - lastRequestMs;
    if (elapsed < MIN_GAP_MS) {
      const wait = MIN_GAP_MS - elapsed;
      setStatus(`⏳ Espera ${(wait/1000).toFixed(1)}s...`, 'warn');
      await new Promise(r => setTimeout(r, wait));
    }
  }

  // ── Grabación ──────────────────────────────────────────────────────────────
  async function startRecording() {
    if (isRecording || isCoolingDown()) return;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    cancelReview();

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
      audioChunks = [];
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start(100);
      isRecording = true;
      setMicState('recording');
      setStatus('Grabando... suelta para revisar');
      transcDiv.textContent = '';
    } catch {
      setStatus('Sin acceso al micrófono', 'error');
    }
  }

  async function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    isRecording = false;
    mediaRecorder.stop();
    stream.getTracks().forEach(t => t.stop());
    setMicState('processing');
    setStatus('Transcribiendo...', 'warn');

    await new Promise(r => { mediaRecorder.onstop = r; });

    const blob = new Blob(audioChunks, { type: audioChunks[0]?.type || 'audio/webm' });
    if (blob.size < 500) { setMicState('idle'); setStatus('Listo para hablar'); return; }

    try {
      const formData = new FormData();
      formData.append('audio', blob, 'voice.webm');
      const res  = await fetch(`${BAKO_URL}/api/desktop/transcribe`, { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok || !data.transcription) {
        setMicState('idle');
        setStatus('No se detectó habla', 'error');
        return;
      }

      showReview(data.transcription.trim());
      setMicState('idle');
    } catch {
      setMicState('idle');
      setStatus('Error al transcribir', 'error');
    }
  }

  // ── Review panel ──────────────────────────────────────────────────────────
  function showReview(text) {
    reviewText.value = text;
    userEditing      = false;
    countdownVal     = REVIEW_SECS;

    reviewPanel.classList.add('visible');
    progressBar.style.transition = 'none';
    progressBar.style.width      = '100%';

    setStatus(`Revisa el mensaje — enviando en ${REVIEW_SECS}s`, 'warn');

    // Forzar reflow antes de activar la transición
    void progressBar.offsetWidth;
    progressBar.style.transition = `width ${REVIEW_SECS}s linear`;
    progressBar.style.width      = '0%';

    startCountdown();
  }

  function startCountdown() {
    stopCountdown();
    countdownVal = REVIEW_SECS;
    tickReview();
  }

  function tickReview() {
    if (countdownVal <= 0) { sendReview(); return; }
    reviewCD.textContent = countdownVal + 's';
    countdownVal--;
    countdownTimer = setTimeout(tickReview, 1000);
  }

  function stopCountdown() {
    if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  }

  function cancelReview() {
    stopCountdown();
    reviewPanel.classList.remove('visible');
    setMicState('idle');
    setStatus('Listo para hablar');
  }

  function sendReview() {
    const text = reviewText.value.trim();
    cancelReview();
    if (text) sendMessage(text);
  }

  // Edición manual → pausa el countdown
  reviewText.addEventListener('input', () => {
    if (!userEditing) {
      userEditing = true;
      stopCountdown();
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
      reviewCD.textContent = '✏️';
      setStatus('Editado — pulsa Enviar cuando estés listo', 'ok');
    }
  });
  reviewText.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReview(); }
  });

  btnSendReview.addEventListener('click',  sendReview);
  btnCancel.addEventListener('click',     cancelReview);

  // ── Input de texto ────────────────────────────────────────────────────────
  function sendTextInput() {
    const text = textInput.value.trim();
    if (!text || isCoolingDown()) return;
    textInput.value = '';
    sendMessage(text);
  }
  btnSendText.addEventListener('click', sendTextInput);
  textInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendTextInput(); }
  });

  // ── Envío a BAKO ──────────────────────────────────────────────────────────
  async function sendMessage(text) {
    if (isCoolingDown()) { setStatus('Rate limit activo', 'warn'); return; }

    await waitGapIfNeeded();

    transcDiv.textContent = `"${text}"`;
    responseDiv.textContent = '';
    setUiEnabled(false);
    setStatus('Enviando a BAKO...', 'warn');

    try {
      const res  = await fetch(`${BAKO_URL}/api/desktop/text`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      lastRequestMs = Date.now();
      const data = await res.json();

      // Rate limit
      const bodyStr = JSON.stringify(data).toLowerCase();
      if (res.status === 429 || (res.status >= 400 && (bodyStr.includes('rate_limit') || bodyStr.includes('límite') || bodyStr.includes('limit')))) {
        const secs = parseCooldownSecs(bodyStr);
        setCooldown(secs);
        responseDiv.textContent = `⏳ Rate limit — próximo mensaje en ${secs}s`;
        return;
      }

      if (!res.ok) {
        responseDiv.textContent = `⚠️ ${data.error || 'Error del servidor'}`;
        setUiEnabled(true);
        setStatus('Listo para hablar');
        return;
      }

      responseDiv.textContent = data.response || '';

      if (data.audio) {
        setMicState('playing');
        setStatus('BAKO está hablando...', 'ok');
        const bytes = atob(data.audio);
        const arr   = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: 'audio/webm' }));
        currentAudio = new Audio(url);
        currentAudio.onended = () => { URL.revokeObjectURL(url); setMicState('idle'); setStatus('Listo para hablar'); };
        currentAudio.onerror  = () => { setMicState('idle'); setStatus('Listo para hablar'); };
        await currentAudio.play().catch(() => {});
      } else {
        setMicState('idle');
        setStatus('Listo para hablar');
      }

      setUiEnabled(true);

    } catch {
      responseDiv.textContent = '⚠️ Sin conexión con BAKO';
      setMicState('idle');
      setUiEnabled(true);
      setStatus('Sin conexión', 'error');
    }
  }

  // ── Touch / Mouse para el micrófono ───────────────────────────────────────
  function onTouchStart(e) { e.preventDefault(); startRecording(); }
  function onTouchEnd(e)   { e.preventDefault(); stopRecording();  }

  micBtn.addEventListener('mousedown',  startRecording);
  micBtn.addEventListener('mouseup',    stopRecording);
  micBtn.addEventListener('mouseleave', () => { if (isRecording) stopRecording(); });

  // ── Inicialización ─────────────────────────────────────────────────────────
  window.addEventListener('load', () => {
    if (navigator.mediaDevices) {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(s => s.getTracks().forEach(t => t.stop()))
        .catch(() => {});
    }
  });
</script>
</body>
</html>
